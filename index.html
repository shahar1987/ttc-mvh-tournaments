<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תן לי שולחן — מועדון טניס שולחן מבואות החרמון</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F4C81">
<link rel="icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תן לי שולחן">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --felt:#0F4C81; --felt-2:#14679F; --felt-3:#0A3A63;
  --chalk:#FFFFFF; --ball:#C2410C; --ball-2:#9A3412; --ball-soft:#FFEDD5;
  --rubber:#B4291F; --pip:#171717;
  --ink:#111827; --ink-2:#374151; --ink-3:#4B5563;
  --paper:#F4F6F8; --card:#FFFFFF; --edge:#E2E8F0; --rule:#EEF1F4;
  --ok:#166534; --warn:#92400E; --bad:#B91C1C;
  --r-soft:16px; --r-hard:6px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(17,24,39,.06);
  --shadow-2:0 10px 28px -12px rgba(17,24,39,.28);
  --tap:44px;
  --gut:clamp(12px,3vw,26px);
  --ease:cubic-bezier(.22,.68,.28,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:clamp(15px,.35vw + 14px,17px);line-height:1.5;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;line-height:1.12;font-weight:600;letter-spacing:-.01em}
h1{font-family:"Heebo",system-ui,sans-serif;font-weight:800;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.01em}
h2{font-size:clamp(18px,1.6vw,22px)}
h3{font-size:clamp(16px,1.2vw,18px)}
.num{font-family:"Heebo",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

/* ============ controls ============ */
button{
  font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--edge);
  border-radius:var(--r-soft);padding:11px 18px;min-height:var(--tap);
  background:var(--card);color:var(--ink);
  transition:background .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease),box-shadow .16s var(--ease);
}
button:hover{border-color:#BFCCC3;background:#FAFBFC}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ball);outline-offset:2px;border-radius:8px}
button.primary{background:var(--ball);color:#fff;border-color:var(--ball);font-weight:600;box-shadow:0 2px 0 var(--ball-2)}
button.primary:hover{background:var(--ball-2);border-color:var(--ball-2)}
button.primary:active{box-shadow:none;transform:translateY(2px) scale(.99)}
button.green{background:var(--felt);color:var(--chalk);border-color:var(--felt);font-weight:600;box-shadow:0 2px 0 var(--felt-3)}
button.green:hover{background:var(--felt-2);border-color:var(--felt-2)}
button.green:active{box-shadow:none;transform:translateY(2px) scale(.99)}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2);box-shadow:none}
button.ghost:hover{background:rgba(12,26,21,.05);border-color:transparent}
button.danger{color:var(--bad);border-color:#EBC9C5}
button.danger:hover{background:#FCF1EF;border-color:#DFA9A2}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
button.big{padding:15px 24px;font-size:clamp(16px,1.1vw,18px);min-height:52px}
input,select,textarea{
  font:inherit;padding:11px 13px;min-height:var(--tap);
  border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--ink);width:100%;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
input:hover,select:hover{border-color:#C4D0C8}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label{display:block;font-weight:500;margin:16px 0 6px;font-size:.94em}
.hint{color:var(--ink-3);font-size:.86em;margin-top:6px;line-height:1.45}
.muted{color:var(--ink-2)}
.tiny{font-size:.8em;color:var(--ink-3)}

/* ============ shell ============ */
header{
  background:var(--felt);color:var(--chalk);
  padding:calc(12px + env(safe-area-inset-top)) var(--gut) 0;
  border-bottom:3px solid var(--chalk);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand .logo{display:flex;align-items:center;gap:11px}
.brand .logo i{
  width:20px;height:20px;border-radius:50%;background:var(--ball);flex:none;
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.16),0 0 0 3px rgba(194,65,12,.18);
}
.brand .logotext{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand .club{font-family:"Heebo",sans-serif;font-weight:800;font-size:clamp(15px,1.7vw,19px);letter-spacing:0}
.brand .club .dedic{font-weight:600;opacity:.88;font-size:.92em}
.brand .tagline{font-family:"Assistant",sans-serif;font-weight:400;opacity:.78;font-size:clamp(11px,1.1vw,13px);margin-top:2px;display:block}
.brand .tname{font-weight:600;opacity:.9}
header button.ghost{color:var(--chalk);padding:8px 12px;min-height:38px}
header button.ghost:hover{background:rgba(255,255,255,.12)}
#syncDot{width:9px;height:9px;border-radius:50%;background:#9AA6A0;display:inline-block;flex:none;transition:background .3s var(--ease)}
button.sync{display:inline-flex;align-items:center;gap:7px;font-size:.82em;padding:7px 12px;min-height:36px;opacity:.85}
button.sync.bad{background:rgba(255,107,90,.18);opacity:1}
button.sync.bad #syncDot{animation:idleBlink 1.6s infinite}
.steps{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.step{
  flex:1 0 auto;min-width:78px;padding:9px 12px 11px;text-align:center;
  font-size:.86em;font-weight:400;border:0;border-radius:0;background:none;
  color:rgba(255,255,255,.6);white-space:nowrap;min-height:0;
  border-bottom:3px solid transparent;margin-bottom:-3px;transition:color .2s var(--ease),border-color .2s var(--ease);
}
.step:hover:not(:disabled){color:rgba(255,255,255,.9);background:none;border-color:rgba(255,255,255,.3)}
.step.done{color:rgba(255,255,255,.85)}
.step.active{color:#fff;font-weight:500;border-bottom-color:var(--ball)}
.step:disabled{opacity:.35;cursor:default}
main{max-width:1320px;margin:0 auto;padding:calc(var(--gut) + 4px) var(--gut) calc(96px + env(safe-area-inset-bottom))}

/* ============ surfaces ============ */
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-soft);padding:clamp(15px,2vw,22px);box-shadow:var(--shadow-1)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.toolbar{
  position:sticky;bottom:0;z-index:20;
  background:linear-gradient(to top,var(--paper) 62%,rgba(241,243,238,0));
  padding:16px 0 calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;
}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:10px 16px;min-height:var(--tap);
  border:1px solid var(--edge);border-radius:var(--r-pill);background:#fff;cursor:pointer;user-select:none;
  transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease);
}
.chip:hover{border-color:#BFCCC3}
.chip:active{transform:scale(.97)}
.chip input{width:auto;margin:0;min-height:0;accent-color:var(--felt)}
.chip.on{background:var(--felt);color:#fff;border-color:var(--felt)}
.chip.on input{accent-color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:.78em;font-weight:500;background:#E7ECF1;color:var(--ink-2)}
.pill.seed1{background:var(--ball-soft);color:var(--ball-2)}
.pill.seed2{background:#DCEAF6;color:var(--felt)}
.pill.seed3{background:#E4E8F5;color:#3B4C8F}
.warn-box{background:#FFF8E6;border:1px solid #F0DDA6;border-left:4px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:.9em}
.err-box{background:#FCF0EE;border:1px solid #EEC2BC;border-left:4px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:.9em}
.explain{background:#F2F5F8;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:.9em}
.explain li{margin:4px 0}
.sep{display:inline-block;width:1px;height:.85em;background:var(--edge);margin:0 8px;vertical-align:-1px}

/* ============ players ============ */
.plist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.plist li{
  display:flex;align-items:center;gap:11px;padding:10px 13px;background:#fff;
  border:1px solid var(--edge);border-radius:12px;
  animation:rowIn .26s var(--ease) both;
}
.plist li .n{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.plist li .club{color:var(--ink-3);font-size:.82em}
.plist li button{padding:6px 10px;min-height:36px}
@keyframes rowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ============ groups ============ */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.group{background:#fff;border:1px solid var(--edge);border-radius:var(--r-soft);overflow:hidden;box-shadow:var(--shadow-1)}
.group header.gh{
  background:none;padding:13px 15px;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--rule);box-shadow:inset 0 3px 0 var(--gc,var(--felt));
  position:sticky;top:0;
}
.group header.gh h3{display:flex;align-items:center;gap:9px}
.gdot{width:11px;height:11px;border-radius:50%;background:var(--gc,var(--felt));display:inline-block;flex:none}
.group ul{list-style:none;margin:0;padding:8px;min-height:64px}
.group li{
  padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  cursor:grab;border:1px dashed transparent;transition:background .15s var(--ease),border-color .15s var(--ease);
}
.group li:hover{background:#F2F5F8}
.group li.selected{border-color:var(--ball);background:var(--ball-soft)}
.group.drop{outline:3px dashed var(--ball);outline-offset:-4px;background:#FFFBF6}

/* ============ live layout ============ */
.live-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.stat{display:flex;gap:clamp(14px,2.5vw,28px);flex-wrap:wrap}
.stat b{font-family:"Heebo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(20px,2.4vw,27px);display:block;line-height:1.05}
.stat span{font-size:.76em;color:var(--ink-3)}
.progress{height:6px;background:#E1E7E1;border-radius:var(--r-pill);overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--felt-2),var(--felt));transition:width .6s var(--ease)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:3px solid transparent;border-radius:0;
  padding:11px 15px;color:var(--ink-3);white-space:nowrap;margin-bottom:-1px;box-shadow:none;min-height:0;
  transition:color .18s var(--ease),border-color .18s var(--ease);
}
.tab:hover{background:none;color:var(--ink-2);border-color:var(--edge)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ball)}
.live-grid{display:grid;gap:clamp(14px,2vw,22px)}
.lg-main{min-width:0}
.lg-side{min-width:0}
@media (min-width:900px){
  .live-grid{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);align-items:start}
  .lg-side{position:sticky;top:calc(env(safe-area-inset-top) + 128px);max-height:calc(100dvh - 190px);overflow-y:auto;padding-left:4px}
  .lg-side .section-h{margin-top:0}
}

/* ============ the table cards (hero) ============ */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:clamp(10px,1.4vw,14px)}
.table{
  position:relative;border-radius:var(--r-hard);padding:13px;min-height:146px;
  color:var(--chalk);background:linear-gradient(160deg,var(--felt-2),var(--felt) 62%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),var(--shadow-1);
  display:flex;flex-direction:column;justify-content:space-between;
  animation:tableIn .3s var(--ease) both;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
@keyframes tableIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
.table::before{ /* centre line */
  content:"";position:absolute;inset:3px;border-radius:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.5) calc(50% - 1px),rgba(255,255,255,.5) calc(50% + 1px),transparent calc(50% + 1px));
}
.table::after{ /* net */
  content:"";position:absolute;left:-4px;right:-4px;top:50%;height:14px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 4px),rgba(255,255,255,.12);
  border-top:2px solid rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.25);
  pointer-events:none;opacity:.55;
}
.table.free{background:var(--felt-3);color:rgba(255,255,255,.62);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
.table.free::before,.table.free::after{opacity:.28}
.table.busy{cursor:pointer}
.table.busy:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),var(--shadow-2)}
.table.stuck{animation:tableIn .3s var(--ease) both,alertPulse 1.9s 1.2s infinite}
@keyframes alertPulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),var(--shadow-1)}50%{box-shadow:inset 0 0 0 3px var(--ball),0 0 0 5px rgba(194,65,12,.28)}}
.table .tnum{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.76em;opacity:.85;font-weight:500}
.table .tnum .lock{
  font-size:.9em;background:rgba(0,0,0,.28);padding:4px 10px;border-radius:var(--r-pill);
  cursor:pointer;border:0;color:#fff;min-height:0;box-shadow:none;
}
.table .tnum .lock:hover{background:rgba(0,0,0,.42)}
.table .players{position:relative;z-index:2;font-weight:600;font-size:clamp(15px,1.15vw,17.5px);line-height:1.24;text-align:center;margin:10px 0;text-shadow:0 1px 2px rgba(0,0,0,.22)}
.table .players .vs{display:block;font-size:.62em;font-weight:400;opacity:.7;margin:3px 0}
.table .meta{position:relative;z-index:2;font-size:.76em;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.table .free-lbl{position:relative;z-index:2;text-align:center;font-family:"Heebo",sans-serif;font-weight:700;font-size:clamp(16px,1.3vw,19px);margin:auto;letter-spacing:.02em}
.table.drop{outline:3px dashed var(--ball);outline-offset:-3px}
.table.clearing{animation:clearWipe .42s var(--ease) both}
@keyframes clearWipe{0%{filter:brightness(1.5)}100%{filter:none}}

/* ============ queue ============ */
.queue{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.queue li{
  display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;
  border:1px solid var(--edge);border-radius:12px;border-right:5px solid var(--gc,var(--ink-3));
  cursor:grab;animation:rowIn .24s var(--ease) both;
}
.queue li:hover{border-color:#C6D2C9}
.queue li .who{flex:1;font-weight:500;min-width:0}
.queue li .why{font-size:.76em;color:var(--ink-3);font-weight:400;margin-top:3px}
.queue li .rest{font-size:.78em;color:var(--warn);white-space:nowrap}
.idle-warn{color:var(--warn);font-weight:600}
.idle-bad{color:var(--bad);font-weight:600;animation:idleBlink 2.2s infinite}
@keyframes idleBlink{0%,100%{opacity:1}50%{opacity:.55}}
.toggle{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  padding:10px 15px;min-height:var(--tap);border:1px solid var(--edge);border-radius:12px;background:#fff;
}
.toggle:hover{border-color:#C4D0C8}
.toggle i{width:40px;height:23px;border-radius:var(--r-pill);background:#CBD5CD;position:relative;transition:background .22s var(--ease);flex:none}
.toggle i::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:right .22s var(--ease)}
.toggle.on i{background:var(--felt)}
.toggle.on i::after{right:20px}

/* ============ scoresheet tables ============ */
table.st{width:100%;border-collapse:collapse;font-size:.88em}
table.st th,table.st td{padding:9px 7px;text-align:center;white-space:nowrap}
table.st th{font-weight:400;color:var(--ink-3);font-size:.82em;border-bottom:2px solid var(--edge)}
table.st td{border-bottom:1px solid var(--rule)}
table.st td.name{text-align:right;font-weight:500;white-space:normal}
table.st tbody tr:nth-child(even) td,table.st tr:nth-child(even) td{background:#FAFBFC}
table.st tr.q td{background:#E9F3EC;box-shadow:inset 3px 0 0 var(--ok)}
table.st tr.c td{background:#FBF6EC;box-shadow:inset 3px 0 0 var(--warn)}
table.st tr{transition:transform .5s var(--ease)}
table.st tr.moved{animation:climb .55s var(--ease) both}
@keyframes climb{0%{background:var(--ball-soft)}100%{background:transparent}}
.tb{
  display:inline-flex;align-items:center;justify-content:center;margin-right:6px;
  width:20px;height:20px;border-radius:50%;background:#E7ECF1;color:var(--ink-2);
  font-size:.72em;border:0;padding:0;min-height:0;box-shadow:none;
}
.tb:hover{background:var(--ball);color:#fff}
.matchlist{list-style:none;margin:10px 0 0;padding:0;font-size:.88em}
.matchlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid var(--rule)}
.matchlist li:last-child{border-bottom:0}
.matchlist li .sc{font-family:"Heebo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05em}
.matchlist li .edit{color:var(--ink-3);font-size:.82em;background:none;border:0;padding:2px 6px;min-height:0;box-shadow:none}
.matchlist li .edit:hover{color:var(--ball);background:none}

/* ============ bracket ============ */
.bracket{display:flex;gap:clamp(16px,2.4vw,30px);overflow-x:auto;padding:6px 0 20px;-webkit-overflow-scrolling:touch}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:190px;flex:none}
.round h4{margin:0 0 2px;font-size:.78em;color:var(--ink-3);font-weight:400;text-align:center}
.bm{background:#fff;border:1px solid var(--edge);border-radius:10px;overflow:hidden;font-size:.88em;box-shadow:var(--shadow-1);transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:9px 12px}
.bm div+div{border-top:1px solid var(--rule)}
.bm .w{font-weight:600;color:var(--felt);background:#E8F1FA}
.bm .bye{color:var(--ink-3);font-style:italic}
.bm .sc{font-family:"Heebo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.bm.live{border-color:var(--ball);box-shadow:0 0 0 3px rgba(194,65,12,.18)}

/* ============ podium ============ */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.4vw,14px);margin:26px 0 30px;min-height:230px}
.pod{flex:1;max-width:230px;text-align:center}
.pod .name{font-weight:600;font-size:clamp(15px,1.5vw,20px);margin-bottom:10px;min-height:52px;display:flex;align-items:flex-end;justify-content:center}
.pod .block{
  font-family:"Heebo",sans-serif;font-weight:900;background:var(--felt);color:#fff;border-radius:10px 10px 0 0;
  font-size:clamp(30px,4vw,46px);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.16);transform-origin:bottom;animation:rise .55s var(--ease) both;
}
.pod.p1 .block{height:clamp(110px,15vw,158px);background:var(--ball);box-shadow:inset 0 -7px 0 var(--ball-2);animation-delay:.24s}
.pod.p2 .block{height:clamp(84px,11vw,116px);animation-delay:.1s}
.pod.p3 .block{height:clamp(62px,8vw,86px);background:var(--felt-3);animation-delay:0s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ============ modal ============ */
.modal-bg{
  position:fixed;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;
  animation:fadeIn .18s var(--ease) both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:580px;
  max-height:92dvh;overflow:auto;padding:22px 18px calc(26px + env(safe-area-inset-bottom));
  animation:sheetUp .28s var(--ease) both;
}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:720px){
  .modal-bg{align-items:center;padding:24px}
  .modal{border-radius:20px;padding:26px;animation:popIn .22s var(--ease) both}
  @keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
}
.modal h2{margin-bottom:6px}
.names{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;text-align:center;font-weight:600;font-size:clamp(15px,1.3vw,18px);align-items:start}
.names>div:first-child{border-bottom:4px solid var(--rubber);padding-bottom:8px}
.names>div:last-child{border-bottom:4px solid var(--pip);padding-bottom:8px}
.names .setsw{display:block;font-family:"Heebo",sans-serif;font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(30px,4vw,40px);color:var(--felt);line-height:1.1;margin-top:4px}
.sets{display:grid;gap:9px;margin:16px 0}
.set{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:center}
.set input{
  text-align:center;font-family:"Heebo",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(24px,3.4vw,30px);
  padding:12px 4px;border-width:2px;border-radius:12px;min-height:56px;
}
.set input:focus{border-color:var(--felt);box-shadow:0 0 0 4px rgba(15,76,129,.12)}
.set input:disabled{background:#F3F6F3;color:var(--ink-3);border-color:var(--rule)}
.set input.bad{border-color:var(--bad);background:#FDF4F3}
.set .x{text-align:center;color:var(--ink-3);font-size:.85em}
.quick{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}
.quick button{font-size:.84em;padding:8px 13px;min-height:38px}

/* ============ toast ============ */
.toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
  background:var(--ink);color:#fff;padding:13px 17px;border-radius:14px;
  display:flex;gap:16px;align-items:center;z-index:60;box-shadow:var(--shadow-2);
  max-width:min(92vw,520px);animation:toastUp .3s var(--ease) both;
}
@keyframes toastUp{from{transform:translate(-50%,18px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast button{background:var(--ball);color:#fff;border:0;padding:7px 14px;min-height:36px;font-weight:600}
.toast button:hover{background:var(--ball-2)}

/* ============ login / list ============ */
.login{max-width:400px;margin:clamp(24px,7vh,64px) auto}
.tlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.tlist li{
  background:#fff;border:1px solid var(--edge);border-radius:var(--r-soft);padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;
  box-shadow:var(--shadow-1);animation:rowIn .28s var(--ease) both;
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);
}
.tlist li:hover{border-color:var(--felt);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.tlist .tn{font-weight:600;font-size:1.08em}
.tlist .tm{font-size:.84em;color:var(--ink-3);margin-top:3px}

/* ============ hall display ============ */
.public{
  position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,var(--felt-2),var(--felt-3) 78%);
  color:#fff;z-index:100;padding:clamp(18px,3vw,34px);overflow:auto;
  animation:fadeIn .3s var(--ease) both;
}
.public h1{font-size:clamp(26px,4vw,46px);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.public .tables{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(12px,1.6vw,18px)}
.public .table{min-height:clamp(150px,20vh,200px)}
.public .table .players{font-size:clamp(19px,2.4vw,30px)}
.public .next{margin-top:26px}
.public .next h2{font-size:clamp(20px,2.4vw,30px);margin-bottom:10px;color:var(--ball)}
.public .next ul{padding:0;margin:0}
.public .next li{
  font-size:clamp(17px,2vw,26px);padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.14);
  list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  animation:rowIn .34s var(--ease) both;
}
.public .next li small{opacity:.65;font-size:.66em}
.public .pod .block{animation:none}

/* ============ responsive ============ */
@media (max-width:600px){
  .brand .tname{width:100%;margin-top:2px}
  .toolbar button{flex:1 1 auto}
  .toolbar button.big{flex-basis:100%}
  .stat{gap:16px}
  .set{grid-template-columns:1fr 30px 1fr}
  table.st{font-size:.82em}
  table.st th,table.st td{padding:8px 4px}
}
@media (min-width:601px) and (max-width:1024px){
  .tables{grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr))}
}
@media (max-height:520px) and (orientation:landscape){
  header{position:static}
  .modal{max-height:96dvh;padding-top:14px}
  .set input{min-height:44px;font-size:22px;padding:6px 4px}
  .names .setsw{font-size:26px}
}
@media (hover:none){
  button:hover,.chip:hover,.tlist li:hover,.table.busy:hover{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{
  header,.toolbar,.tabs,.progress,button,#pSearchOut,.live-grid .lg-side{display:none!important}
  main{padding:0;max-width:none}
  body{background:#fff;font-size:11pt}
  .card,.group{box-shadow:none;break-inside:avoid}
  .table{color:#000;background:#fff!important;box-shadow:inset 0 0 0 1px #000}
  .table::after,.table::before{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><i></i><div class="logotext"><span class="club">מועדון טניס שולחן מבואות החרמון <b class="dedic">ע"ש רוני גלבוע</b></span><span class="tagline">תן לי שולחן<span class="tname" id="hdrName"></span></span></div></div>
    <div class="row" style="gap:6px">
      <button id="syncBtn" class="ghost sync" onclick="diagnostics()" title="מצב השמירה"><span id="syncDot"></span><span id="syncTxt"></span></button>
      <button class="ghost" style="color:#fff" id="btnList" onclick="closeTournament()">כל התחרויות</button>
      <button class="ghost" style="color:#fff" id="btnOut" onclick="FB.signOut()">יציאה</button>
    </div>
  </div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>
<div id="public"></div>

<script>
/* ========================= STATE ========================= */
const KEY='tenlishulchan.v1';
const GROUP_COLORS=['#1F6F4A','#2F6DB5','#B5512F','#7B4FB5','#B58A2F','#2FA3A8','#B52F7A','#5B7B2F','#2F4FB5','#8A6A4F'];
const DEF={
  phase:'setup',
  settings:{name:'',date:new Date().toISOString().slice(0,10),system:'groups-ko',format:'singles',boGroup:5,boKO:5,tables:4,groupSize:4,advance:2,consolation:true,third:false,restMin:5,model:'group',auto:true,stuckMult:1.5,swissRounds:5,swissKO:false,swissAdvance:4,rounds:6,target:21,kingTarget:11},
  players:[],groups:[],matches:[],tables:[],lots:{},log:[],lastPlayed:{},tab:'tables',avgDur:{}, koBuilt:false, lastUndo:null, kingQueue:[], kingHolders:{}, byes:[]
};
let S=fresh();
function fresh(){return JSON.parse(JSON.stringify(DEF))}
function save(){if(!TID)return;S.rev=(S.rev||0)+1;try{localStorage.setItem(KEY+'.'+TID,JSON.stringify(S))}catch(e){}scheduleCloud()}
function uid(){return Math.random().toString(36).slice(2,9)}
function logEv(t,kind){
  S.log.unshift({t:Date.now(),m:t,by:(PROFILE&&PROFILE.name)||(USER&&USER.email)||'',k:kind||'',d:S.rev||0});
  if(S.log.length>800)S.log.length=800;
}
function P(id){return S.players.find(p=>p.id===id)}
function pname(id){return id==null?'—':(P(id)?P(id).name:'?')}
function G(id){return S.groups.find(g=>g.id===id)}
function gcolor(gid){const i=S.groups.findIndex(g=>g.id===gid);return GROUP_COLORS[(i<0?0:i)%GROUP_COLORS.length]}
function needSets(m){const bo=(m.stage==='group'||m.stage==='swiss')?S.settings.boGroup:S.settings.boKO;return Math.ceil(bo/2)}
function sys(){return S.settings.system||'groups-ko'}
function isPointGame(m){return m.stage==='round'||m.stage==='king'}
function sideIds(m,i){return i===1?(m.t1||(m.p1?[m.p1]:[])):(m.t2||(m.p2?[m.p2]:[]))}
function sideName(m,i){const a=sideIds(m,i);return a.length?a.map(pname).join(' / '):'—'}
function matchPids(m){return [...sideIds(m,1),...sideIds(m,2)]}
const SYSTEMS={
 'groups-ko':{n:'בתים + נוקאאוט',d:'הקלאסי: כל אחד משחק בבית קטן, המובילים עולים לעץ הדחה.',steps:['setup','players','draw','live','ko','final'],live:'שלב הבתים'},
 'swiss':{n:'שוויצרית',d:'מספר סיבובים קבוע, כל סיבוב מול יריב בניקוד דומה. אף אחד לא מודח.',steps:['setup','players','live','ko','final'],live:'סיבובים'},
 'americano':{n:'אמריקנו — זוגות מתחלפים',d:'מחליפים פרטנר בכל סיבוב, הניקוד אישי. הכי חברתי.',steps:['setup','players','live','final'],live:'סיבובים'},
 'mexicano':{n:'מקסיקנו',d:'כמו אמריקנו, אבל הזוגות נקבעים לפי הטבלה החיה — המשחקים נהיים צמודים.',steps:['setup','players','live','final'],live:'סיבובים'},
 'king':{n:'מלך השולחן',d:'המנצח נשאר, המפסיד יורד והבא בתור נכנס. משחקים קצרים, תור מהיר.',steps:['setup','players','live','final'],live:'מלך השולחן'}
};
function isTeamSys(){return sys()==='americano'||sys()==='mexicano'}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
function mins(ms){return Math.round(ms/60000)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function commit(){save();render();queueMicrotask(markMoves)}
let _ranks={};
function markMoves(){
  const rows=document.querySelectorAll('table.st tr[data-pid]');
  if(!rows.length){return}
  const next={};let i=0;
  rows.forEach(tr=>{const k=tr.dataset.pid;next[k]=i++});
  if(Object.keys(_ranks).length){
    rows.forEach(tr=>{const k=tr.dataset.pid;
      if(_ranks[k]!==undefined&&_ranks[k]!==next[k])tr.classList.add('moved')});
  }
  _ranks=next;
}

/* ========================= NAV ========================= */
const STEP_NAMES={setup:'הגדרות',players:'שחקנים',draw:'הגרלה',live:'משחקים',ko:'נוקאאוט',final:'פודיום'};
function steps(){const st=SYSTEMS[sys()].steps.slice();if(sys()==='swiss'&&!S.settings.swissKO)return st.filter(x=>x!=='ko');return st}
function stepIndex(p){return steps().indexOf(p)}
function goto(p){S.phase=p;commit();window.scrollTo(0,0)}
function renderSteps(){
  const cur=stepIndex(S.phase);
  const reach={setup:true,players:true,draw:S.groups.length>0,live:S.matches.length>0,ko:S.koBuilt,final:canFinish()};
  const lbl=Object.assign({},STEP_NAMES,{live:SYSTEMS[sys()].live});
  document.getElementById('steps').innerHTML=steps().map((k,i)=>`<button class="step ${i<cur?'done':''} ${i===cur?'active':''}" ${reach[k]?'':'disabled'} onclick="goto('${k}')">${lbl[k]}</button>`).join('');
  document.getElementById('hdrName').textContent=S.settings.name?'· '+S.settings.name:'';
}

/* ========================= RENDER ========================= */
function render(){
  const app=document.getElementById('app');
  document.getElementById('btnList').style.display=TID?'':'none';document.getElementById('btnOut').style.display=USER?'':'none';
  if(!window.FB){app.innerHTML='<p class="muted" style="text-align:center;margin-top:60px">טוען…</p>';return}
  if(!USER){document.getElementById('steps').innerHTML='';return renderLogin(app)}
  if(!PROFILE){document.getElementById('steps').innerHTML='';app.innerHTML='<div class="card login"><h2>אין הרשאה</h2><p class="muted">המשתמש הזה לא מוגדר במערכת הנוכחות של המועדון. בקשו משלום להוסיף אותו.</p><button onclick="FB.signOut()">יציאה</button></div>';return}
  if(!TID){document.getElementById('steps').innerHTML='';document.getElementById('hdrName').textContent='';return renderList(app)}
  renderSteps();
  ({setup:renderSetup,players:renderPlayers,draw:renderDraw,live:renderLive,ko:renderLive,final:renderFinal})[S.phase](app);
}

/* ---------- Setup ---------- */
function renderSetup(app){
  const s=S.settings;const locked=S.matches.length>0;
  app.innerHTML=`
  <h1>הגדרות התחרות</h1>
  <p class="muted">כמה החלטות קטנות, ואחר כך כל השאר רץ לבד.</p>
  <div class="card stack">
    ${locked?'<div class="warn-box">התחרות כבר התחילה — אפשר לשנות רק שולחנות, מודל פיזור ומנוחה.</div>':''}
    <div class="grid2">
      <div><label>שם התחרות</label><input id="s_name" value="${esc(s.name)}" placeholder="למשל: גביע הקיבוץ 2026" ${locked?'disabled':''}></div>
      <div><label>תאריך</label><input id="s_date" type="date" value="${s.date}" ${locked?'disabled':''}></div>
    </div>
    <div><label>שיטת התחרות</label>
      <div class="radio-group">
        ${Object.entries(SYSTEMS).map(([v,o])=>`<label class="chip ${s.system===v?'on':''}"><input type="radio" name="sysx" value="${v}" ${s.system===v?'checked':''} ${locked?'disabled':''} onchange="setSystem(this.value)">${o.n}</label>`).join('')}
      </div>
      <div class="hint">${SYSTEMS[s.system].d}</div>
      ${locked?'':'<button style="margin-top:10px" onclick="wizard()">🧭 לא בטוח? תעזור לי לבחור</button>'}
    </div>
    ${isTeamSys()||s.system==='king'?'':`<div><label>סוג משחק</label>
      <div class="radio-group">
        ${[['singles','יחידים'],['doubles','זוגות קבועים']].map(([v,l])=>`<label class="chip ${s.format===v?'on':''}"><input type="radio" name="fmt" value="${v}" ${s.format===v?'checked':''} ${locked?'disabled':''} onchange="setFmt(this.value)">${l}</label>`).join('')}
      </div>
      <div class="hint">בזוגות קבועים מזינים כל זוג כשם אחד (למשל "דני / יוסי").</div>
    </div>`}
    ${s.system==='groups-ko'?`<div class="grid2">
      <div><label>מערכות בשלב הבתים</label><select id="s_bog" ${locked?'disabled':''}>${[3,5,7].map(b=>`<option value="${b}" ${s.boGroup==b?'selected':''}>הטוב מ-${b} (ראשון ל-${Math.ceil(b/2)})</option>`).join('')}</select></div>
      <div><label>מערכות בנוקאאוט</label><select id="s_bok" ${locked?'disabled':''}>${[3,5,7].map(b=>`<option value="${b}" ${s.boKO==b?'selected':''}>הטוב מ-${b} (ראשון ל-${Math.ceil(b/2)})</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div><label>שחקנים בבית (יעד)</label><select id="s_gs" ${locked?'disabled':''}>${[3,4,5].map(n=>`<option value="${n}" ${s.groupSize==n?'selected':''}>${n}</option>`).join('')}</select></div>
      <div><label>עולים מכל בית לנוקאאוט</label><select id="s_adv" ${locked?'disabled':''}>${[1,2].map(n=>`<option value="${n}" ${s.advance==n?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <label class="chip ${s.consolation?'on':''}"><input type="checkbox" ${s.consolation?'checked':''} ${locked?'disabled':''} onchange="S.settings.consolation=this.checked;commit()">בית ניחומים לשאר השחקנים</label>
      <label class="chip ${s.third?'on':''}"><input type="checkbox" ${s.third?'checked':''} ${locked?'disabled':''} onchange="S.settings.third=this.checked;commit()">משחק על מקום 3</label>
    </div>`:''}
    ${s.system==='swiss'?`<div class="grid2">
      <div><label>מספר סיבובים</label><input id="s_swr" type="number" min="3" max="12" value="${s.swissRounds}" ${locked?'disabled':''}><div class="hint">מומלץ ${suggestSwissRounds(S.players.length||16)} ל-${S.players.length||16} שחקנים</div></div>
      <div><label>מערכות בכל משחק</label><select id="s_bog" ${locked?'disabled':''}>${[3,5,7].map(b=>`<option value="${b}" ${s.boGroup==b?'selected':''}>הטוב מ-${b}</option>`).join('')}</select></div>
    </div>
    <div class="row"><label class="chip ${s.swissKO?'on':''}"><input type="checkbox" ${s.swissKO?'checked':''} ${locked?'disabled':''} onchange="S.settings.swissKO=this.checked;commit()">נוקאאוט למובילים בסוף</label>
      ${s.swissKO?`<div style="min-width:160px"><label style="margin:0">כמה עולים</label><select onchange="S.settings.swissAdvance=+this.value;commit()">${[2,4,8,16].map(n=>`<option value="${n}" ${s.swissAdvance==n?'selected':''}>${n}</option>`).join('')}</select></div>`:''}</div>`:''}
    ${isTeamSys()?`<div class="grid2">
      <div><label>מספר סיבובים</label><input id="s_rounds" type="number" min="3" max="20" value="${s.rounds}" ${locked?'disabled':''}><div class="hint">כל סיבוב = משחק אחד לכל שולחן. 6–8 זה ערב טיפוסי.</div></div>
      <div><label>משחק עד כמה נקודות</label><select id="s_target" ${locked?'disabled':''}>${[11,15,16,21,24,32].map(n=>`<option value="${n}" ${s.target==n?'selected':''}>${n} נקודות</option>`).join('')}</select><div class="hint">הניקוד אישי — הנקודות שצברת נשארות שלך.</div></div>
    </div>`:''}
    ${s.system==='king'?`<div class="grid2">
      <div><label>משחק עד כמה נקודות</label><select id="s_king" ${locked?'disabled':''}>${[5,7,11,15,21].map(n=>`<option value="${n}" ${s.kingTarget==n?'selected':''}>${n} נקודות</option>`).join('')}</select></div>
      <div><label>מנוחה בין משחקים (דקות)</label><input id="s_rest2" type="number" min="0" max="30" value="${s.restMin}"></div>
    </div><div class="hint">המנצח נשאר על השולחן. המפסיד עובר לסוף התור.${S.players.length&&S.players.length<=s.tables*2?` שימו לב: עם ${S.players.length} שחקנים ו-${s.tables} שולחנות אותם זוגות עלולים לחזור על עצמם — כדאי פחות שולחנות.`:''}</div>`:''}
    <div class="grid2">
      <div><label>שולחנות פעילים באולם</label><input id="s_tables" type="number" min="1" max="40" value="${s.tables}"></div>
      ${s.system==='king'?'<div></div>':`<div><label>מנוחה בין משחקים (דקות)</label><input id="s_rest" type="number" min="0" max="30" value="${s.restMin}"></div>`}
    </div>

function saveSetup(){

  s.tables=Math.max(1,+q('s_tables').value||1);s.restMin=+((q('s_rest')||q('s_rest2')||{value:s.restMin}).value)||0;

function syncTables(){
  const n=S.settings.tables;const before=S.tables.length;
  while(S.tables.length<n)S.tables.push({n:S.tables.length+1,lock:null,matchId:null,note:''});
  if(S.tables.length>n){const extra=S.tables.slice(n);if(extra.some(t=>t.matchId)){toast('יש שולחנות בשימוש. סיימו אותם קודם.');S.settings.tables=S.tables.length;return}S.tables.length=n;extra.forEach(t=>{const h=(S.kingHolders||{})[t.n];if(h&&P(h)&&!S.kingQueue.includes(h))S.kingQueue.unshift(h);if(S.kingHolders)delete S.kingHolders[t.n]})}
  let healed=false;
  for(const t of S.tables){
    if(!t.matchId)continue;
    const m=S.matches.find(x=>x.id===t.matchId);
    if(!m||m.status!=='playing'){t.matchId=null;healed=true}
  }
  for(const m of S.matches){
    if(m.status==='playing'&&!S.tables.some(t=>t.matchId===m.id)){m.status='pending';m.table=null;m.startedAt=null;healed=true}
  }
  if((S.tables.length!==before||healed)&&TID)save();
}

/* ---------- Structure planner ---------- */
function groupSizes(n,ng){const base=Math.floor(n/ng),rem=n%ng;return Array.from({length:ng},(_,i)=>base+(i<rem?1:0))}
function planFor(n,ng){
  const sizes=groupSizes(n,ng);
  const matches=sizes.reduce((a,x)=>a+x*(x-1)/2,0);
  const perPlayer=Math.min(...sizes)-1;
  const avg=avgDuration(S.settings.boGroup)/60000;
  const par=Math.max(1,Math.min(S.settings.tables,ng*(S.settings.model==='group'?1:99)));
  const est=Math.ceil(matches/Math.max(1,S.settings.tables)*avg);
  return {ng,sizes,matches,perPlayer,est,ok:Math.min(...sizes)>=3&&Math.max(...sizes)<=5};
}
function bestPlan(n){
  const opts=[];for(let ng=1;ng<=Math.floor(n/3);ng++){const pl=planFor(n,ng);if(pl.ok)opts.push(pl)}
  if(!opts.length)return [planFor(n,Math.max(1,Math.round(n/4)))];
  const target=S.settings.groupSize;
  const cost=p=>p.sizes.reduce((a,x)=>a+Math.abs(x-target),0);
  opts.sort((a,b)=>cost(a)-cost(b)||a.ng-b.ng);
  return opts;
}
function suggestText(n){
  if(sys()==='swiss'){const r=suggestSwissRounds(n);return `${n} רשומים — מומלץ ${r} סיבובים (כל אחד ישחק ${r} משחקים).`}
  if(isTeamSys()){const courts=Math.min(S.settings.tables,Math.floor(n/4));const sit=n-courts*4;return `${n} רשומים — ${courts} שולחנות פעילים בכל סיבוב${sit>0?`, ${sit} ינוחו בכל סיבוב בסבב`:''}.`}
  if(sys()==='king')return `${n} רשומים — תור אחד לכל שולחן, המנצח נשאר.`;
  const p=bestPlan(n)[0];
  return `${n} רשומים — מומלץ ${p.ng===1?'בית אחד':p.ng+' בתים'} (${planDesc(p)}). כל אחד ישחק לפחות ${p.perPlayer} משחקים, סיום משוער אחרי כ-${p.est} דק׳.`;
}
function planDesc(p){
  const uniq=[...new Set(p.sizes)].sort((a,b)=>b-a);const parts=uniq.map(u=>`${p.sizes.filter(x=>x===u).length}×${u}`);
  return parts.length<2?parts[0]:parts.slice(0,-1).join(', ')+' ו'+(/^[0-9]/.test(parts[parts.length-1])?'-':'')+parts[parts.length-1];
}
function planCard(n){
  if(sys()==='swiss'){
    const r=S.settings.swissRounds||suggestSwissRounds(n);
    return `<div class="card" style="margin-bottom:14px"><h3>מבנה מוצע</h3><div class="row" style="margin-top:8px">${[3,4,5,6,7,8].map(x=>`<button class="chip ${x===r?'on':''}" onclick="S.settings.swissRounds=${x};commit()">${x} סיבובים</button>`).join('')}</div>
    <div class="hint">${r} סיבובים ל-${n} שחקנים${r===suggestSwissRounds(n)?' — זו ההמלצה':''}. סיום משוער: כ-${Math.ceil(r*Math.ceil(n/2)/Math.max(1,S.settings.tables)*avgDuration(S.settings.boGroup)/60000)} דק׳.</div></div>`;
  }
  if(isTeamSys()||sys()==='king')return '';
  const opts=bestPlan(n).slice(0,4);const cur=S.settings.groupSize;
  return `<div class="card" style="margin-bottom:14px"><h3>איך לחלק לבתים?</h3><p class="tiny">בחרו אפשרות — אפשר לשנות גם אחרי ההגרלה.</p>
  <div style="overflow-x:auto"><table class="st"><tr><th></th><th>בתים</th><th>גדלים</th><th>משחקים</th><th>לכל שחקן</th><th>זמן משוער</th></tr>
  ${opts.map((p,i)=>`<tr style="cursor:pointer" onclick="S.settings.groupSize=${p.sizes[0]};S.planNg=${p.ng};commit()"><td>${(S.planNg?S.planNg===p.ng:i===0)?'✅':'○'}</td><td><b>${p.ng}</b></td><td>${[...new Set(p.sizes)].sort((a,b)=>b-a).map(u=>`${p.sizes.filter(x=>x===u).length}×${u}`).join(' + ')}</td><td>${p.matches}</td><td>${p.perPlayer}</td><td>~${p.est} דק׳</td></tr>`).join('')}
  </table></div></div>`;
}

/* ---------- Draw (snake seeding) ---------- */
function makeDraw(keepManual){
  const n=S.players.length;
  let ng=S.planNg||bestPlan(n)[0].ng;
  const s1=S.players.filter(p=>p.seed===1).length;if(s1>ng)ng=s1;
  if(n/ng<3&&ng>1)ng=Math.max(1,Math.floor(n/3));
  buildGroups(ng);goto('draw');
}
function buildGroups(ng){
  const groups=[];for(let i=0;i<ng;i++)groups.push({id:uid(),name:'בית '+String.fromCharCode(65+i),pids:[]});
  const bySeed=s=>shuffle(S.players.filter(p=>p.seed===s));
  const seeds=[...bySeed(1),...bySeed(2),...bySeed(3)];
  // snake
  let dir=1,gi=0;
  seeds.forEach((p,i)=>{groups[gi].pids.push(p.id);if(dir===1){if(gi===ng-1)dir=-1;else gi++}else{if(gi===0)dir=1;else gi--}});
  // unseeded: balanced random with club separation
  const rest=shuffle(S.players.filter(p=>p.seed===0));
  for(const p of rest){
    const minLen=Math.min(...groups.map(g=>g.pids.length));
    let cands=groups.filter(g=>g.pids.length===minLen);
    const noClub=cands.filter(g=>!p.club||!g.pids.some(id=>P(id).club&&P(id).club===p.club));
    if(noClub.length)cands=noClub;
    cands[Math.floor(Math.random()*cands.length)].pids.push(p.id);
  }
  S.groups=groups;
}
function reshuffle(){buildGroups(S.groups.length);commit();toast('הוגרל מחדש — המדורגים במקומם')}
function clubWarnings(){
  const w=[];for(const g of S.groups){const seen={};for(const id of g.pids){const c=P(id).club;if(!c)continue;(seen[c]=seen[c]||[]).push(P(id).name)}for(const c in seen)if(seen[c].length>1)w.push(`${g.name}: ${seen[c].join(' ו-')} (${c})`)}return w;
}

function dropTo(ev,gid){ev.preventDefault();const id=ev.dataTransfer.getData('t');moveTo(id,gid)}
function moveTo(pid,gid){for(const g of S.groups)g.pids=g.pids.filter(x=>x!==pid);G(gid).pids.push(pid);selPid=null;commit()}
function removeEmptyGroup(){const i=S.groups.findIndex(g=>!g.pids.length);if(i<0){toast('אין בית ריק. גררו את השחקנים החוצה קודם.');return}S.groups.splice(i,1);S.groups.forEach((g,j)=>g.name='בית '+String.fromCharCode(65+j));commit()}

/* ---------- Group schedule (circle method, 1v2 last) ---------- */
function groupSchedule(n){
  const ids=[];for(let i=1;i<=n;i++)ids.push(i);if(n%2)ids.push(0);
  const m=ids.length,rounds=[];let arr=ids.slice();
  for(let r=0;r<m-1;r++){const rm=[];for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a&&b)rm.push([a,b])}rounds.push(rm);arr=[arr[0],arr[m-1],...arr.slice(1,m-1)]}
  const li=rounds.findIndex(r=>r.some(([a,b])=>(a===1&&b===2)||(a===2&&b===1)));if(li>=0){const x=rounds.splice(li,1)[0];rounds.push(x)}
  return rounds;
}
function seedOrderInGroup(g){return g.pids.slice().sort((a,b)=>{const sa=P(a).seed||9,sb=P(b).seed||9;return sa-sb})}
function confirmDraw(){
  if(S.matches.some(m=>m.status==='done')&&!confirm('יש כבר תוצאות. הגרלה מחדש תמחק את כולן. להמשיך?'))return;
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.koBuilt=false;S.koRounds=0;S.consRounds=0;S.lots={};S.lastUndo=null;
  for(const g of S.groups){
    const order=seedOrderInGroup(g);
    groupSchedule(order.length).forEach((rm,ri)=>rm.forEach(([a,b])=>S.matches.push(newMatch({stage:'group',groupId:g.id,round:ri+1,p1:order[a-1],p2:order[b-1]}))));
  }
  syncTables();applyModelLocks();S.lastPlayed={};S.phaseStart=Date.now();
  logEv(`ההגרלה אושרה — ${S.groups.length} בתים, ${S.players.length} שחקנים`,'draw');goto('live');
  if(S.settings.auto)autoDistribute();
}
function newMatch(o){return Object.assign({id:uid(),sets:[],status:'pending',table:null,winner:null,wo:false,startedAt:null,endedAt:null},o)}
function applyModelLocks(){
  const m=S.settings.model;
  if(m==='pool'){S.tables.forEach(t=>t.lock=null);return}
  if(m==='group'){
    S.tables.forEach(t=>t.lock=null);
    const gs=S.groups.slice();
    if(gs.length>S.tables.length){gs.slice(0,S.tables.length-1).forEach((g,i)=>S.tables[i].lock=g.id);S.settings.model='hybrid';return}
    gs.forEach((g,i)=>{if(S.tables[i])S.tables[i].lock=g.id});
    // extras to largest groups
    const extra=S.tables.slice(gs.length);const byLen=gs.slice().sort((a,b)=>b.pids.length-a.pids.length);
    extra.forEach((t,i)=>t.lock=byLen[i%byLen.length].id);
  }
}

/* ========================= ENGINE: results & standings ========================= */
function setsWon(m){let a=0,b=0;for(const [x,y] of m.sets){if(x>y)a++;else if(y>x)b++}return [a,b]}
function validSet(a,b){if(a==null||b==null||isNaN(a)||isNaN(b))return false;const hi=Math.max(a,b),lo=Math.min(a,b);if(hi<11)return false;if(hi===11)return lo<=9;return hi-lo===2}
function otherScore(v){if(v<=9)return 11;if(v===10)return 12;return v+2}
function playerStats(pid,ms){
  let mp=0,w=0,l=0,sw=0,sl=0,pw=0,pl=0,played=0;
  for(const m of ms){if(m.status!=='done')continue;const me=m.p1===pid?0:m.p2===pid?1:-1;if(me<0)continue;played++;
    const [a,b]=setsWon(m);const ws=me?b:a,ls=me?a:b;sw+=ws;sl+=ls;
    for(const [x,y] of m.sets){pw+=me?y:x;pl+=me?x:y}
    if(m.winner===pid){w++;mp+=2}else{l++;mp+=(m.wo||m.retired===pid)?0:1}}
  return {mp,w,l,sw,sl,pw,pl,played,sr:sl?sw/sl:(sw?Infinity:0),pr:pl?pw/pl:(pw?Infinity:0)};
}
function rankGroup(gid){
  const g=G(gid);const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===gid);
  const explain={};g.pids.forEach(id=>explain[id]=[]);
  const order=resolve(g.pids.slice(),ms,explain,gid,0);
  return {order,explain,stats:Object.fromEntries(g.pids.map(id=>[id,playerStats(id,ms)]))};
}
function resolve(pids,ms,explain,gid,depth){
  if(pids.length===1)return pids;
  const sub=ms.filter(m=>m.status==='done'&&pids.includes(m.p1)&&pids.includes(m.p2));
  const st={};pids.forEach(id=>st[id]=playerStats(id,sub));
  const crit=[['mp','נקודות משחק',id=>st[id].mp],['sr','יחס מערכות',id=>st[id].sr],['pr','יחס נקודות',id=>st[id].pr]];
  const scope=depth===0?'':' (רק במשחקים בין השווים)';
  for(const [k,label,f] of crit){
    const vals=new Set(pids.map(f));
    const fmt=id=>k==='mp'?st[id].mp:k==='sr'?`${st[id].sw}:${st[id].sl}`:`${st[id].pw}:${st[id].pl}`;
    if(vals.size===1){if(depth>0||k!=='mp')pids.forEach(id=>explain[id].push(`${label}${scope}: ${fmt(id)} — שווה, ממשיכים לשובר הבא`));continue}
    const sorted=pids.slice().sort((a,b)=>f(b)-f(a));
    const parts=[];for(const id of sorted){const v=f(id);const last=parts[parts.length-1];if(last&&f(last[0])===v)last.push(id);else parts.push([id])}
    if(depth>0||k!=='mp')pids.forEach(id=>explain[id].push(`${label}${scope}: ${fmt(id)} — הכריע`));
    if(parts.length===1)continue;
    let out=[];
    for(const part of parts){
      if(part.length===1)out.push(part[0]);
      else{part.forEach(id=>explain[id].push(`עדיין שוויון בין ${part.map(pname).join(', ')} — מתחילים מחדש רק ביניהם`));out=out.concat(resolve(part,ms,explain,gid,depth+1))}
    }
    return out;
  }
  // full tie -> lot
  const key=gid+':'+pids.slice().sort().join(',');
  if(!S.lots[key]){S.lots[key]=shuffle(pids.slice());save()}
  const lot=S.lots[key].filter(id=>pids.includes(id));
  pids.forEach(id=>explain[id].push('שוויון מוחלט — המיקום נקבע בהגרלה'));
  return lot;
}
function groupDone(gid){return S.matches.filter(m=>m.stage==='group'&&m.groupId===gid).every(m=>m.status==='done')}
function allGroupsDone(){return S.matches.some(m=>m.stage==='group')&&S.matches.filter(m=>m.stage==='group').every(m=>m.status==='done')}

/* ========================= ENGINE: scheduling ========================= */
function busyPids(){const s=new Set();for(const m of S.matches)if(m.status==='playing')matchPids(m).forEach(id=>s.add(id));return s}
function idleSince(pid){return S.lastPlayed[pid]||S.phaseStart||Date.now()}
function pendingMatches(){return S.matches.filter(m=>m.status==='pending'&&sideIds(m,1).length&&sideIds(m,2).length)}
function groupProgress(gid){const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===gid);return ms.length?ms.filter(m=>m.status==='done').length/ms.length:1}
function priority(m,now){
  const why=[];let sc=0;
  if(m.stage==='group'){
    const minRound=Math.min(...pendingMatches().filter(x=>x.stage==='group').map(x=>x.round));
    sc-=100*(m.round-minRound);why.push('סיבוב '+m.round);
    const maxP=Math.max(...S.groups.map(g=>groupProgress(g.id)));const lag=maxP-groupProgress(m.groupId);
    if(lag>0.01){sc+=30*lag*4;why.push(G(m.groupId).name+' מפגר')}
  }else if(m.stage==='swiss'||m.stage==='round'){
    const pend=pendingMatches().filter(x=>x.stage===m.stage);
    const minRound=pend.length?Math.min(...pend.map(x=>x.round)):m.round;
    sc-=100*(m.round-minRound);why.push('סיבוב '+m.round);
  }else if(m.stage==='king'){why.push('מלך השולחן')}
  else{sc-=100*m.koRound;why.push(m.bracket==='cons'?'ניחומים':'נוקאאוט'+' · '+koRoundName(m))}
  const pids=matchPids(m);
  const idle=Math.max(...pids.map(id=>now-idleSince(id)));sc+=2*mins(idle);
  const restMs=S.settings.restMin*60000;const lastEnd=Math.max(0,...pids.map(id=>S.lastPlayed[id]||0));
  const owes=m.owes;if(owes){sc+=40;why.push('חייב משחקים')}
  else if(lastEnd&&now-lastEnd<restMs){sc-=60;why.push('במנוחה')}
  if(idle>0)why.push('ממתין '+mins(idle)+' דק׳');
  return {sc,why};
}
function candidatesFor(table){
  const now=Date.now();const busy=busyPids();
  let c=pendingMatches().filter(m=>!matchPids(m).some(id=>busy.has(id)));
  if(table.lock&&S.matches.some(m=>m.stage==='group'&&m.status!=='done'))c=c.filter(m=>m.groupId===table.lock);
  c=c.map(m=>({m,...priority(m,now)}));
  const nonRest=c.filter(x=>!x.why.includes('במנוחה'));if(nonRest.length)c=nonRest;
  c.sort((a,b)=>b.sc-a.sc||(a.m.round||0)-(b.m.round||0));
  return c;
}
function startOn(table,m){table.matchId=m.id;m.table=table.n;m.status='playing';m.startedAt=Date.now();logEv(`${sideName(m,1)} – ${sideName(m,2)} לשולחן ${table.n}`)}
function distribute(){
  if(sys()==='king')return kingFill();
  let n=0;for(const t of S.tables){if(t.matchId)continue;const c=candidatesFor(t);if(c.length){startOn(t,c[0].m);n++}}
  if(!n)n=maybeNextRound()?distribute():0;
  return n;
}
function maybeNextRound(){
  if(sys()==='swiss'&&!S.koBuilt){if(S.matches.filter(m=>m.stage==='swiss').every(m=>m.status==='done'))return swissNextRound()>0}
  if(isTeamSys()){const ms=S.matches.filter(m=>m.stage==='round');const r=Math.max(0,...ms.map(m=>m.round));
    if(r<S.settings.rounds&&ms.every(m=>m.status==='done'))return americanoRound(r+1)>0}
  return false;
}
function autoDistribute(){if(S.settings.auto){distribute();commit()}}
function distributeClick(){const n=distribute();commit();toast(n?`${n} משחקים נשלחו לשולחנות`:'אין משחק מתאים לשולחן פנוי כרגע')}

function estimateFinish(){
  const sy=sys();const par=Math.max(1,S.tables.length);
  if(S.koBuilt){const left=S.matches.filter(m=>m.stage==='ko'&&m.status!=='done'&&!m.bye).length;
    if(!left)return null;return fmtTime(Date.now()+avgDuration(S.settings.boKO)*Math.ceil(left/par))}
  if(sy==='king')return null;
  if(sy==='swiss'){const perRound=Math.ceil(S.players.length/2);const roundsLeft=S.settings.swissRounds-swissRoundsDone();
    const left=S.matches.filter(m=>m.stage==='swiss'&&m.status!=='done').length+roundsLeft*perRound;
    if(!left)return null;return fmtTime(Date.now()+avgDuration(S.settings.boGroup)*Math.ceil(left/par))}
  if(isTeamSys()){const perRound=Math.min(par,Math.floor(S.players.length/4));const roundsLeft=S.settings.rounds-amRoundsDone();
    const left=S.matches.filter(m=>m.stage==='round'&&m.status!=='done').length+roundsLeft*perRound;
    if(!left)return null;const avg=(S.settings.target/11)*8*60000;return fmtTime(Date.now()+avg*Math.ceil(left/par))}
  const left=S.matches.filter(m=>m.stage==='group'&&m.status!=='done').length;
  if(!left)return null;return fmtTime(Date.now()+avgDuration(S.settings.boGroup)*Math.ceil(left/par));
}
function canFinish(){
  const sy=sys();
  if(sy==='king')return S.matches.some(m=>m.stage==='king'&&m.status==='done');
  if(isTeamSys())return S.matches.filter(m=>m.stage==='round').length>0&&S.matches.filter(m=>m.stage==='round').every(m=>m.status==='done')&&amRoundsDone()>=S.settings.rounds;
  if(sy==='swiss'&&!S.settings.swissKO)return swissRoundsDone()>=S.settings.swissRounds&&S.matches.filter(m=>m.stage==='swiss').every(m=>m.status==='done');
  return S.koBuilt&&koFinished();
}

function tablesTab(){
  const now=Date.now();const bo=S.koBuilt?S.settings.boKO:S.settings.boGroup;const avg=avgDuration(bo);
  const groupPhase=!S.koBuilt;
  const freeCount=S.tables.filter(t=>!t.matchId).length;

    </div>
    <span class="tiny">${{group:'בית = שולחן',pool:'מחסנית משותפת',hybrid:'משולב'}[S.settings.model]}${groupPhase?'':' · בנוקאאוט כל השולחנות משותפים'}</span>
  </div>
  <div class="live-grid"><div class="lg-main">
  <div class="tables">${S.tables.map(t=>{
    const m=t.matchId?S.matches.find(x=>x.id===t.matchId):null;
    if(!m)return `<div class="table free" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="this.classList.remove('drop');dropMatch(event,${t.n})">
      <div class="tnum"><span>שולחן ${t.n}</span>${groupPhase&&S.settings.model!=='pool'?`<button class="lock" onclick="lockTable(${t.n})">${t.lock?esc(G(t.lock)?.name||''):'🔓 פתוח לכולם'}</button>`:''}</div>
      <div class="free-lbl">פנוי</div><div class="meta"><span>${t.lock&&groupPhase?'ממתין למשחק מ'+esc(G(t.lock)?.name||''):'גררו משחק לכאן'}</span></div></div>`;
    const dur=now-m.startedAt;const stuck=dur>avg*S.settings.stuckMult;
    return `<div class="table busy ${stuck?'stuck':''}" onclick="openResult('${m.id}')">
      <div class="tnum"><span>שולחן ${t.n}</span><span>${matchLabel(m)}</span></div>
      <div class="players">${esc(sideName(m,1))}<span class="vs">נגד</span>${esc(sideName(m,2))}</div>
      <div class="meta"><span>${mins(dur)} דק׳${stuck?' · אולי שכחו לדווח?':''}</span><span>הזינו תוצאה</span></div></div>`}).join('')}</div>
  </div><aside class="lg-side">
  <div class="section-h"><h2>בתור (${q.length})</h2><span class="tiny">גררו לשולחן פנוי</span></div>
  ${q.length?`<ul class="queue">${q.slice(0,40).map(x=>{const m=x.m;const i1=mins(now-idleSince(sideIds(m,1)[0])),i2=mins(now-idleSince(sideIds(m,2)[0]));const cls=v=>v>=30?'idle-bad':v>=20?'idle-warn':'';
    return `<li style="--gc:${m.stage==='group'?gcolor(m.groupId):'var(--ball)'}" draggable="${x.busy?'false':'true'}" ondragstart="event.dataTransfer.setData('m','${m.id}')" ${x.busy?'style="opacity:.5"':''}>
      <div class="who"><span class="${cls(i1)}">${esc(sideName(m,1))}</span> – <span class="${cls(i2)}">${esc(sideName(m,2))}</span><div class="why">${matchLabel(m)} · ${x.why.filter(w=>w!=='במנוחה').join(' · ')}${x.busy?' · אחד מהם משחק עכשיו':''}</div></div>
      ${x.rest?'<span class="rest">במנוחה</span>':''}</li>`}).join('')}${q.length>40?`<li class="tiny">ועוד ${q.length-40} משחקים</li>`:''}</ul>`:`<div class="card muted">אין משחקים ממתינים${S.tables.some(t=>t.matchId)?'. מחכים שהשולחנות יתפנו.':'.'}</div>`}
  </aside></div>`;
}
function matchLabel(m){
  if(m.stage==='group')return `${G(m.groupId)?.name||''} · סיבוב ${m.round}`;
  if(m.stage==='swiss')return `סיבוב ${m.round}`;

}
function dropMatch(ev,tn){ev.preventDefault();const id=ev.dataTransfer.getData('m');const m=S.matches.find(x=>x.id===id);const t=S.tables.find(x=>x.n===tn);if(!m||!t||t.matchId||m.status!=='pending')return;const busy=busyPids();if(matchPids(m).some(x=>busy.has(x))){toast('אחד השחקנים משחק עכשיו');return}startOn(t,m);commit()}
function lockTable(tn){

  <div class="row" style="margin-top:16px"><button class="primary" onclick="S.tables.find(x=>x.n===${tn}).lock=document.querySelector('input[name=lk]:checked').value||null;if(S.settings.model==='group')S.settings.model='hybrid';closeModal();commit();autoDistribute()">שמור</button><button class="ghost" onclick="closeModal()">ביטול</button></div>`);
}

/* ---------- Result entry ---------- */
function openResult(mid){
  const m=S.matches.find(x=>x.id===mid);
  if(isPointGame(m))return openPointResult(m);
  const need=needSets(m);const bo=need*2-1;
  const cur=m.sets.slice();while(cur.length<bo)cur.push([null,null]);
  modal(`<h2>${matchLabel(m)}${m.table?' · שולחן '+m.table:''}</h2>
  <div class="names"><div>${esc(sideName(m,1))}<span class="setsw" id="swA">0</span></div><div></div><div>${esc(sideName(m,2))}<span class="setsw" id="swB">0</span></div></div>
  <div class="quick"><span class="tiny">מהיר:</span><button onclick="quickFill('${mid}',0)">${esc(sideName(m,1))} ${need}:0</button><button onclick="quickFill('${mid}',1)">${esc(sideName(m,2))} ${need}:0</button></div>
  <div class="sets" id="sets">${cur.map((s,i)=>`<div class="set"><input type="number" inputmode="numeric" min="0" id="a${i}" value="${s[0]??''}" data-i="${i}" data-side="0" placeholder="–"><span class="x">${i+1}</span><input type="number" inputmode="numeric" min="0" id="b${i}" value="${s[1]??''}" data-i="${i}" data-side="1" placeholder="–"></div>`).join('')}</div>
  <div class="hint">מקלידים צד אחד — הצד השני מתמלא לבד. 10 → 12, 11+ → הפרש 2.</div>
  <div id="resErr" class="err-box" style="display:none;margin-top:8px"></div>
  <div class="row" style="margin-top:16px"><button class="primary big" id="saveRes" onclick="saveResult('${mid}')">שמור ופנה שולחן</button>
    <button class="ghost" onclick="closeModal()">סגור</button></div>
  <details style="margin-top:14px"><summary class="tiny" style="cursor:pointer">מצבים מיוחדים</summary>
    <div class="row" style="margin-top:8px">
      <button class="danger" onclick="walkover('${mid}','${m.p2}')">${esc(sideName(m,2))} לא הגיע/ה</button>
      <button class="danger" onclick="walkover('${mid}','${m.p1}')">${esc(sideName(m,1))} לא הגיע/ה</button>
      ${m.status==='playing'?`<button class="danger" onclick="retire('${mid}','${m.p2}')">${esc(pname(m.p2))} פרש/ה</button><button class="danger" onclick="retire('${mid}','${m.p1}')">${esc(pname(m.p1))} פרש/ה</button>`:''}
      ${m.status==='playing'?`<button onclick="backToQueue('${mid}')">החזר לתור (הוזן בטעות)</button>`:''}
    </div></details>`);
  const box=document.getElementById('sets');
  box.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',e=>{const i=+inp.dataset.i,side=+inp.dataset.side;const v=inp.value===''?null:+inp.value;const other=document.getElementById((side?'a':'b')+i);
      if(v!==null&&v>=0){const ov=other.value===''?null:+other.value;if(ov===null||!validSet(v,ov)||(ov!==null&&ov<v&&v<=10))other.value=otherScore(v);}
      if(v===null)other.value='';
      refreshSets(m)});
    inp.addEventListener('focus',()=>inp.select());
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const i=+inp.dataset.i;const nxt=document.getElementById('a'+(i+1));if(nxt&&!nxt.disabled)nxt.focus();else document.getElementById('saveRes').click()}});
  });
  refreshSets(m);
  setTimeout(()=>{const f=[...box.querySelectorAll('input')].find(x=>!x.disabled&&x.value==='');(f||box.querySelector('input')).focus()},50);
}
function readSets(m){const need=needSets(m);const bo=need*2-1;const sets=[];for(let i=0;i<bo;i++){const a=document.getElementById('a'+i),b=document.getElementById('b'+i);if(!a)break;if(a.value===''&&b.value==='')sets.push(null);else sets.push([+a.value,+b.value])}return sets}
function refreshSets(m){
  const need=needSets(m);const sets=readSets(m);let a=0,b=0,err='';
  sets.forEach((s,i)=>{const ia=document.getElementById('a'+i),ib=document.getElementById('b'+i);
    const decided=a>=need||b>=need;ia.disabled=ib.disabled=decided;
    if(decided){ia.value='';ib.value='';return}
    if(!s){ia.classList.remove('bad');ib.classList.remove('bad');return}
    const ok=validSet(s[0],s[1]);ia.classList.toggle('bad',!ok);ib.classList.toggle('bad',!ok);if(!ok)err='מערכה '+(i+1)+' לא חוקית (11 נק׳, או הפרש 2 אחרי 10:10)';
    if(ok){if(s[0]>s[1])a++;else b++}});
  document.getElementById('swA').textContent=a;document.getElementById('swB').textContent=b;
  const done=(a>=need||b>=need)&&!err;
  const e=document.getElementById('resErr');e.style.display=err?'block':'none';e.textContent=err;
  const btn=document.getElementById('saveRes');btn.disabled=!done;btn.textContent=done?'שמור ופנה שולחן':`צריך עוד ${need-Math.max(a,b)} מערכות`;
}
function quickFill(mid,side){const m=S.matches.find(x=>x.id===mid);const need=needSets(m);for(let i=0;i<need;i++){document.getElementById('a'+i).value=side?0:11;document.getElementById('b'+i).value=side?11:0}refreshSets(m)}
function finishMatch(m,winner,sets,flags){
  const prev=JSON.parse(JSON.stringify(m));
  m.sets=sets;m.winner=winner;m.status='done';m.endedAt=Date.now();Object.assign(m,flags||{});
  if(m.startedAt&&!m.wo){const bo=(m.stage==='group'||m.stage==='swiss')?S.settings.boGroup:S.settings.boKO;const d=S.avgDur[bo]||(S.avgDur[bo]={sum:0,n:0});const dur=m.endedAt-m.startedAt;if(dur>2*60000&&dur<90*60000){d.sum+=dur;d.n++}}
  const prevLP1=S.lastPlayed[m.p1]||null,prevLP2=S.lastPlayed[m.p2]||null;S.lastPlayed[m.p1]=m.endedAt;S.lastPlayed[m.p2]=m.endedAt;
  const t=S.tables.find(x=>x.matchId===m.id);if(t)t.matchId=null;m.table=null;
  logEv(`${pname(m.winner)} ניצח/ה את ${pname(m.winner===m.p1?m.p2:m.p1)} ${setsWon(m).join(':')}${m.wo?' (טכני)':''}`);
  if(m.stage==='ko')advanceKO(m);
  S.lastUndo={mid:m.id,prev,tableN:t?t.n:null,lastPlayed:{[m.p1]:prevLP1,[m.p2]:prevLP2},ids:S.matches.map(x=>x.id)};
  if(m.stage==='swiss'&&S.matches.filter(x=>x.stage==='swiss').every(x=>x.status==='done'))swissNextRound();
  closeModal();commit();
  toast(`${pname(m.winner)} ניצח/ה ${setsWon(m).join(':')}`,{label:'ביטול',fn:undoLast});
  autoDistribute();
}
function saveResult(mid){
  const m=S.matches.find(x=>x.id===mid);const need=needSets(m);
  const sets=readSets(m).filter(Boolean);if(sets.some(s=>!validSet(s[0],s[1])))return;
  let a=0,b=0;for(const [x,y] of sets){if(x>y)a++;else b++}
  if(a<need&&b<need)return;
  const wasDone=m.status==='done';
  if(wasDone&&m.stage==='ko'&&koHasDownstream(m)){if(!confirm('המשחק הזה כבר קידם שחקן בעץ. לשנות בכל זאת? המשחקים הבאים יאופסו.'))return;resetDownstream(m)}
  finishMatch(m,a>need-1?m.p1:m.p2,sets,{wo:false,retired:null});
}
function walkover(mid,absent){const m=S.matches.find(x=>x.id===mid);if(!confirm(`${pname(absent)} לא הגיע/ה — ניצחון טכני ל${pname(absent===m.p1?m.p2:m.p1)}?`))return;if(m.status==='done'&&m.stage==='ko'&&koHasDownstream(m)){if(!confirm('המשחק הזה כבר קידם שחקן בעץ. לשנות בכל זאת? המשחקים הבאים יאופסו.'))return;resetDownstream(m)}const need=needSets(m);const w=absent===m.p1?m.p2:m.p1;const sets=[];for(let i=0;i<need;i++)sets.push(w===m.p1?[11,0]:[0,11]);finishMatch(m,w,sets,{wo:true,retired:null})}
function retire(mid,who){const m=S.matches.find(x=>x.id===mid);const need=needSets(m);const w=who===m.p1?m.p2:m.p1;const sets=readSets(m).filter(s=>s&&validSet(s[0],s[1]));let a=0,b=0;for(const [x,y] of sets){if(x>y)a++;else b++}while((w===m.p1?a:b)<need){sets.push(w===m.p1?[11,0]:[0,11]);if(w===m.p1)a++;else b++}finishMatch(m,w,sets,{wo:false,retired:who})}
function backToQueue(mid){const m=S.matches.find(x=>x.id===mid);const t=S.tables.find(x=>x.matchId===mid);if(t)t.matchId=null;
  if(m.stage==='king'){S.kingQueue=[m.p2,...S.kingQueue.filter(x=>x!==m.p2)];S.matches=S.matches.filter(x=>x.id!==mid);closeModal();commit();return}
  m.status='pending';m.table=null;m.startedAt=null;closeModal();commit()}
function undoLast(){
  const u=S.lastUndo;if(!u)return;const m=S.matches.find(x=>x.id===u.mid);
  if(m.stage==='ko')resetDownstream(m);
  if(u.ids){
    const keep=new Set(u.ids);const created=S.matches.filter(x=>!keep.has(x.id));
    if(created.every(x=>x.status!=='done'||x.bye)){created.forEach(x=>{const t=S.tables.find(tt=>tt.matchId===x.id);if(t)t.matchId=null});S.matches=S.matches.filter(x=>keep.has(x.id));
      if(m.stage==='swiss')S.byes=S.matches.filter(x=>x.stage==='swiss'&&x.bye).map(x=>x.p1);
    }
  }
  if(u.king&&u.king.prevKing){S.kingQueue=u.king.prevKing.q;S.kingHolders=u.king.prevKing.h;S.kingCrowns=u.king.prevKing.c}
  Object.assign(m,u.prev);
  if(m.stage==='ko'&&m.status==='done')advanceKO(m);
  if(u.prev.status==='playing'){const t=S.tables.find(x=>x.n===u.tableN);const busy=new Set();S.matches.forEach(x=>{if(x.status==='playing'&&x.id!==m.id)matchPids(x).forEach(id=>busy.add(id))});if(t&&!t.matchId&&!matchPids(m).some(id=>busy.has(id))){t.matchId=m.id}else{m.status='pending';m.table=null;m.startedAt=null}}
  if(u.lastPlayed)Object.assign(S.lastPlayed,u.lastPlayed);
  S.lastUndo=null;hideToast();logEv('בוטלה התוצאה האחרונה','undo');commit();
}

/* ---------- Point-game result ---------- */
function openPointResult(m){
  const tg=m.target||(m.stage==='king'?S.settings.kingTarget:S.settings.target);
  const sc=m.score||[null,null];
  modal(`<h2>${matchLabel(m)}${m.table?' · שולחן '+m.table:''}</h2>
  <div class="names"><div>${esc(sideName(m,1))}</div><div></div><div>${esc(sideName(m,2))}</div></div>
  <div class="sets"><div class="set"><input type="number" inputmode="numeric" min="0" max="${tg}" id="pa" value="${sc[0]??''}" placeholder="–"><span class="x">:</span><input type="number" inputmode="numeric" min="0" max="${tg}" id="pb" value="${sc[1]??''}" placeholder="–"></div></div>
  <div class="hint">משחק עד ${tg}. מקלידים צד אחד — השני מתמלא להשלמה.</div>
  <div class="quick"><span class="tiny">מהיר:</span><button onclick="document.getElementById('pa').value=${tg};document.getElementById('pb').value=0;pRefresh('${m.id}')">${esc(sideName(m,1))} ${tg}:0</button><button onclick="document.getElementById('pb').value=${tg};document.getElementById('pa').value=0;pRefresh('${m.id}')">${esc(sideName(m,2))} ${tg}:0</button></div>
  <div id="resErr" class="err-box" style="display:none;margin-top:8px"></div>
  <div class="row" style="margin-top:16px"><button class="primary big" id="saveRes" onclick="savePoint('${m.id}')">שמור ופנה שולחן</button><button class="ghost" onclick="closeModal()">סגור</button>
  ${m.status==='playing'?`<button onclick="backToQueue('${m.id}')">החזר לתור</button>`:''}</div>`);
  ['pa','pb'].forEach(id=>{const el=document.getElementById(id);
    el.addEventListener('input',()=>{const other=document.getElementById(id==='pa'?'pb':'pa');const v=el.value===''?null:+el.value;
      if(m.stage!=='king'&&v!==null&&v>=0&&v<=tg)other.value=Math.max(0,tg-v);
      pRefresh(m.id)});
    el.addEventListener('focus',()=>el.select());
    el.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('saveRes').click()});});
  pRefresh(m.id);setTimeout(()=>document.getElementById('pa').focus(),50);
}
function pRefresh(mid){
  const m=S.matches.find(x=>x.id===mid);const tg=m.target||(m.stage==='king'?S.settings.kingTarget:S.settings.target);
  const a=document.getElementById('pa').value===''?null:+document.getElementById('pa').value;
  const b=document.getElementById('pb').value===''?null:+document.getElementById('pb').value;
  let err='';
  if(a===null||b===null)err='';
  else if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0)err='נקודות חייבות להיות מספר שלם וחיובי';
  else if(m.stage==='king'){if(Math.max(a,b)<tg)err='המשחק עד '+tg+' נקודות';else if(a===b)err='חייב מנצח'}
  else if(a+b!==tg)err=`הסכום צריך להיות ${tg} (עכשיו ${a+b})`;
  else if(a===b)err='תיקו לא אפשרי — שנו נקודה אחת';
  const e=document.getElementById('resErr');e.style.display=err?'block':'none';e.textContent=err;
  const ok=a!==null&&b!==null&&!err;document.getElementById('saveRes').disabled=!ok;
}
function savePoint(mid){
  const m=S.matches.find(x=>x.id===mid);
  const a=+document.getElementById('pa').value,b=+document.getElementById('pb').value;
  const winner=a>b?1:2;
  finishPoint(m,[a,b],winner);
}
function finishPoint(m,score,side){
  const prev=JSON.parse(JSON.stringify(m));
  const kingSnap=m.stage==='king'?JSON.parse(JSON.stringify({q:S.kingQueue,h:S.kingHolders,c:S.kingCrowns||{}})):null;
  m.score=score;m.status='done';m.endedAt=Date.now();m.winSide=side;m.winner=sideIds(m,side)[0];
  const t=S.tables.find(x=>x.matchId===m.id);if(t)t.matchId=null;
  matchPids(m).forEach(id=>S.lastPlayed[id]=m.endedAt);
  if(m.stage==='king'&&t){S.kingHolders[t.n]=m.winner;const loser=sideIds(m,side===1?2:1)[0];S.kingQueue=S.kingQueue.filter(x=>x!==loser);S.kingQueue.push(loser);S.kingCrowns=S.kingCrowns||{};S.kingCrowns[m.winner]=(S.kingCrowns[m.winner]||0)+1}
  m.table=null;
  logEv(`${sideName(m,side)} ניצח/ה ${score[0]}:${score[1]}`);
  S.lastUndo={mid:m.id,prev,tableN:t?t.n:null,king:m.stage==='king'?JSON.parse(JSON.stringify({prevKing:kingSnap})):null,ids:S.matches.map(x=>x.id)};
  closeModal();commit();
  toast(`${sideName(m,side)} ${score.join(':')}`,{label:'ביטול',fn:undoLast});
  autoDistribute();
}

/* ---------- Groups tab ---------- */
function groupsTab(){
  return `<div class="groups" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${S.groups.map(g=>{
    const r=rankGroup(g.id);const done=groupDone(g.id);const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===g.id);
    return `<div class="group" style="--gc:${gcolor(g.id)}"><header class="gh"><h3><i class="gdot"></i>${g.name}</h3><span class="tiny">${ms.filter(m=>m.status==='done').length}/${ms.length} משחקים${done?' · הסתיים':''}</span></header>
    <div style="padding:6px 8px;overflow-x:auto"><table class="st"><tr><th>#</th><th style="text-align:right">שם</th><th>מש׳</th><th>נצ׳</th><th>הפ׳</th><th>נק׳</th><th>מערכות</th><th>נקודות</th></tr>

}
