<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תן לי שולחן — ניהול תחרויות</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F6F4A">
<link rel="icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תן לי שולחן">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --table:#1F6F4A; --table-dark:#175538; --line:#F4F7F2; --ball:#F28C28; --ball-dark:#D9741A;
  --ink:#1C221E; --ink-2:#4F5A53; --ink-3:#8A948D; --paper:#F2F4F0; --card:#FFFFFF; --edge:#D8DED9;
  --ok:#2E8B57; --warn:#E0A100; --bad:#C8412B; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--card);color:var(--ink);border:1px solid var(--edge)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
button.primary{background:var(--ball);color:#fff;border-color:var(--ball);font-weight:700}
button.primary:hover{background:var(--ball-dark)}
button.green{background:var(--table);color:#fff;border-color:var(--table);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
button.danger{color:var(--bad);border-color:#EAC6BF}
button:disabled{opacity:.45;cursor:not-allowed}
button.big{padding:16px 22px;font-size:18px;border-radius:14px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input[type=number]{-moz-appearance:textfield}
label{display:block;font-weight:500;margin:14px 0 6px}
.hint{color:var(--ink-3);font-size:14px;margin-top:4px}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:28px;font-weight:900}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}

/* Header */
header{background:var(--table);color:var(--line);padding:14px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.brand .logo i{width:22px;height:22px;border-radius:50%;background:var(--ball);display:inline-block;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.brand .tname{font-weight:400;opacity:.85;font-size:14px}
.steps{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1;min-width:64px;padding:8px 4px 10px;text-align:center;font-size:13px;border-bottom:4px solid rgba(255,255,255,.18);opacity:.65;white-space:nowrap;background:none;color:var(--line);border-radius:0}
.step.done{opacity:.9;border-bottom-color:rgba(255,255,255,.55)}
.step.active{opacity:1;font-weight:700;border-bottom-color:var(--ball)}
.step:disabled{cursor:default}
main{max-width:1180px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--edge);border-radius:999px;background:#fff;cursor:pointer;user-select:none}
.chip input{width:auto;margin:0}
.chip.on{background:var(--table);color:#fff;border-color:var(--table)}
.toolbar{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:14px 0 6px;display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;margin-top:18px}
.stack>*+*{margin-top:14px}
.muted{color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#E9EEEA;color:var(--ink-2)}
.pill.seed1{background:#FDE9D6;color:var(--ball-dark)}
.pill.seed2{background:#E3F0E8;color:var(--table)}
.pill.seed3{background:#E8EAF6;color:#3F51B5}

/* Players */
.plist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid var(--edge);border-radius:10px}
.plist li .n{flex:1;font-weight:500}
.plist li .club{color:var(--ink-3);font-size:13px}

/* Groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.group{background:#fff;border:1px solid var(--edge);border-radius:var(--radius);overflow:hidden}
.group header.gh{background:none;padding:10px 12px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gc,var(--table))}
.group header.gh h3{display:flex;align-items:center;gap:8px}
.gdot{width:12px;height:12px;border-radius:50%;background:var(--gc,var(--table));display:inline-block}
.group ul{list-style:none;margin:0;padding:8px;min-height:60px}
.group li{padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:grab;border:1px dashed transparent}
.group li:hover{background:var(--paper)}
.group li.selected{border-color:var(--ball);background:#FFF4EA}
.group.drop{outline:3px dashed var(--ball);outline-offset:-4px}
.warn-box{background:#FFF7E0;border:1px solid #F1DD9B;border-radius:10px;padding:10px 12px;font-size:14px}
.err-box{background:#FCE9E5;border:1px solid #F2BDB3;border-radius:10px;padding:10px 12px;font-size:14px}

/* Live */
.live-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat b{font-size:20px;display:block;font-weight:900}
.stat span{font-size:12px;color:var(--ink-3)}
.progress{height:8px;background:#E3E8E4;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--table);transition:width .4s}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--edge);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;color:var(--ink-2);white-space:nowrap}
.tab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--ball)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.table{position:relative;border-radius:var(--radius);padding:12px 12px 12px;color:#fff;min-height:132px;background:var(--table);box-shadow:inset 0 0 0 3px var(--line);display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.table::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.55) calc(50% - 1px),rgba(255,255,255,.55) calc(50% + 1px),transparent calc(50% + 1px));pointer-events:none;border-radius:var(--radius)}
.table.free{background:var(--table-dark);box-shadow:inset 0 0 0 3px rgba(244,247,242,.35);color:rgba(255,255,255,.75)}
.table.free::before{opacity:.35}
.table.busy{cursor:pointer}
.table.busy:hover{transform:translateY(-2px)}
.table.stuck{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 3px var(--line)}50%{box-shadow:inset 0 0 0 3px var(--ball),0 0 0 4px rgba(242,140,40,.35)}}
.table .tnum{font-weight:900;font-size:13px;opacity:.85;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.table .tnum .lock{font-size:11px;opacity:.9;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:99px;cursor:pointer;border:0;color:#fff}
.table .players{position:relative;z-index:1;font-weight:700;font-size:17px;line-height:1.25;text-align:center;margin:8px 0}
.table .players small{display:block;font-weight:400;font-size:12px;opacity:.85}
.table .players .vs{display:block;font-size:11px;opacity:.7;margin:2px 0}
.table .meta{position:relative;z-index:1;font-size:12px;opacity:.85;display:flex;justify-content:space-between}
.table .free-lbl{position:relative;z-index:1;text-align:center;font-weight:700;font-size:16px;margin:auto}
.table.drop{outline:3px dashed var(--ball);outline-offset:-3px}
.queue{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.queue li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid var(--edge);border-radius:10px;border-right:6px solid var(--gc,var(--ink-3));cursor:grab}
.queue li .who{flex:1;font-weight:500}
.queue li .why{font-size:12px;color:var(--ink-3)}
.queue li .rest{font-size:12px;color:var(--warn)}
.idle-warn{color:var(--warn);font-weight:700}.idle-bad{color:var(--bad);font-weight:700}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:#fff}
.toggle i{width:38px;height:22px;border-radius:99px;background:#CBD3CD;position:relative;transition:.2s}
.toggle i::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{background:var(--table)}.toggle.on i::after{right:19px}

/* Standings */
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:center;border-bottom:1px solid #EEF1EE;white-space:nowrap}
table.st th{font-weight:500;color:var(--ink-3);font-size:12px}
table.st td.name{text-align:right;font-weight:500}
table.st tr.q td{background:#EAF4EE}
table.st tr.c td{background:#F6F2EA}
.tb{display:inline-block;margin-right:6px;width:18px;height:18px;border-radius:50%;background:#E9EEEA;color:var(--ink-2);font-size:11px;text-align:center;line-height:18px;cursor:pointer;border:0;padding:0}
.matchlist{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.matchlist li{display:flex;justify-content:space-between;padding:5px 4px;border-bottom:1px dashed #EEF1EE}
.matchlist li .sc{font-weight:700}
.matchlist li .edit{color:var(--ink-3);font-size:12px;background:none;border:0;padding:0 6px}

/* Bracket */
.bracket{display:flex;gap:26px;overflow-x:auto;padding:8px 0 18px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:190px}
.round h4{margin:0 0 4px;font-size:13px;color:var(--ink-3);font-weight:500;text-align:center}
.bm{background:#fff;border:1px solid var(--edge);border-radius:10px;overflow:hidden;font-size:14px}
.bm div{display:flex;justify-content:space-between;padding:7px 10px}
.bm div+div{border-top:1px solid #EEF1EE}
.bm .w{font-weight:700;color:var(--table)}
.bm .bye{color:var(--ink-3);font-style:italic}
.bm .sc{font-weight:700}
.bm.live{border-color:var(--ball);box-shadow:0 0 0 2px rgba(242,140,40,.25)}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 26px;min-height:220px}
.pod{flex:1;max-width:220px;text-align:center}
.pod .name{font-weight:900;font-size:20px;margin-bottom:8px;min-height:50px;display:flex;align-items:flex-end;justify-content:center}
.pod .block{background:var(--table);color:#fff;border-radius:12px 12px 0 0;font-size:42px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.pod.p1 .block{height:150px;background:var(--ball)}.pod.p2 .block{height:110px}.pod.p3 .block{height:80px;background:var(--table-dark)}

/* Login / list */
.login{max-width:380px;margin:40px auto}
.tlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.tlist li{background:#fff;border:1px solid var(--edge);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.tlist li:hover{border-color:var(--table)}
.tlist .tn{font-weight:700;font-size:18px}
.tlist .tm{font-size:13px;color:var(--ink-3)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
@media (min-width:700px){.modal-bg{align-items:center;padding:20px}}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:94vh;overflow:auto;padding:20px 18px 24px}
@media (min-width:700px){.modal{border-radius:22px}}
.modal h2{margin-bottom:6px}
.sets{display:grid;gap:8px;margin:14px 0}
.set{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center}
.set input{text-align:center;font-size:26px;font-weight:900;padding:10px 4px;border-width:2px}
.set input:disabled{background:#F3F5F3;color:var(--ink-3)}
.set input.bad{border-color:var(--bad)}
.set .x{text-align:center;color:var(--ink-3)}
.names{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;text-align:center;font-weight:700;font-size:17px}
.names .setsw{display:block;font-size:34px;font-weight:900;color:var(--table)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick button{font-size:13px;padding:6px 10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw}
.toast button{background:var(--ball);color:#fff;border:0;padding:6px 12px}
.explain{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.explain li{margin:3px 0}

/* Public display */
.public{position:fixed;inset:0;background:var(--table-dark);color:#fff;z-index:100;padding:24px;overflow:auto}
.public h1{font-size:40px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.public .tables{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.public .table{min-height:170px}.public .table .players{font-size:26px}
.public .next{margin-top:26px}
.public .next h2{font-size:26px;margin-bottom:10px;color:var(--ball)}
.public .next li{font-size:24px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15);list-style:none;display:flex;justify-content:space-between}
.public .next li small{opacity:.7;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,.toolbar,.tabs,button{display:none!important}main{padding:0}body{background:#fff}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><i></i> תן לי שולחן <span class="tname" id="hdrName"></span></div>
    <div class="row" style="gap:6px">
      <span id="syncDot" title="סנכרון" style="width:10px;height:10px;border-radius:50%;background:#9AA;display:inline-block"></span>
      <button class="ghost" style="color:#fff" id="btnList" onclick="closeTournament()">כל התחרויות</button>
      <button class="ghost" style="color:#fff" id="btnOut" onclick="FB.signOut()">יציאה</button>
    </div>
  </div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>
<div id="public"></div>

<script>
/* ========================= STATE ========================= */
const KEY='tenlishulchan.v1';
const GROUP_COLORS=['#1F6F4A','#2F6DB5','#B5512F','#7B4FB5','#B58A2F','#2FA3A8','#B52F7A','#5B7B2F','#2F4FB5','#8A6A4F'];
const DEF={
  phase:'setup',
  settings:{name:'',date:new Date().toISOString().slice(0,10),format:'singles',boGroup:5,boKO:5,tables:4,groupSize:4,advance:2,consolation:true,third:false,restMin:5,model:'group',auto:true,stuckMult:1.5},
  players:[],groups:[],matches:[],tables:[],lots:{},log:[],lastPlayed:{},tab:'tables',avgDur:{}, koBuilt:false, lastUndo:null
};
let S=fresh();
function fresh(){return JSON.parse(JSON.stringify(DEF))}
function save(){if(!TID)return;S.rev=(S.rev||0)+1;try{localStorage.setItem(KEY+'.'+TID,JSON.stringify(S))}catch(e){}scheduleCloud()}
function uid(){return Math.random().toString(36).slice(2,9)}
function logEv(t){S.log.unshift({t:Date.now(),m:t});if(S.log.length>300)S.log.length=300}
function P(id){return S.players.find(p=>p.id===id)}
function pname(id){return id==null?'—':(P(id)?P(id).name:'?')}
function G(id){return S.groups.find(g=>g.id===id)}
function gcolor(gid){const i=S.groups.findIndex(g=>g.id===gid);return GROUP_COLORS[(i<0?0:i)%GROUP_COLORS.length]}
function needSets(m){const bo=m.stage==='group'?S.settings.boGroup:S.settings.boKO;return Math.ceil(bo/2)}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
function mins(ms){return Math.round(ms/60000)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function commit(){save();render()}

/* ========================= NAV ========================= */
const STEPS=[['setup','הגדרות'],['players','שחקנים'],['draw','הגרלה'],['live','בתים'],['ko','נוקאאוט'],['final','פודיום']];
function stepIndex(p){return STEPS.findIndex(s=>s[0]===p)}
function goto(p){S.phase=p;commit();window.scrollTo(0,0)}
function renderSteps(){
  const cur=stepIndex(S.phase);
  const reach={setup:true,players:true,draw:S.groups.length>0,live:S.matches.length>0,ko:S.koBuilt,final:S.koBuilt&&koFinished()};
  document.getElementById('steps').innerHTML=STEPS.map((s,i)=>`<button class="step ${i<cur?'done':''} ${i===cur?'active':''}" ${reach[s[0]]?'':'disabled'} onclick="goto('${s[0]}')">${s[1]}</button>`).join('');
  document.getElementById('hdrName').textContent=S.settings.name?'· '+S.settings.name:'';
}

/* ========================= RENDER ========================= */
function render(){
  const app=document.getElementById('app');
  document.getElementById('btnList').style.display=TID?'':'none';document.getElementById('btnOut').style.display=USER?'':'none';
  if(!window.FB){app.innerHTML='<p class="muted" style="text-align:center;margin-top:60px">טוען…</p>';return}
  if(!USER){document.getElementById('steps').innerHTML='';return renderLogin(app)}
  if(!PROFILE){document.getElementById('steps').innerHTML='';app.innerHTML='<div class="card login"><h2>אין הרשאה</h2><p class="muted">המשתמש הזה לא מוגדר במערכת הנוכחות של המועדון. בקשו משלום להוסיף אותו.</p><button onclick="FB.signOut()">יציאה</button></div>';return}
  if(!TID){document.getElementById('steps').innerHTML='';document.getElementById('hdrName').textContent='';return renderList(app)}
  renderSteps();
  ({setup:renderSetup,players:renderPlayers,draw:renderDraw,live:renderLive,ko:renderLive,final:renderFinal})[S.phase](app);
}

/* ---------- Setup ---------- */
function renderSetup(app){
  const s=S.settings;const locked=S.matches.length>0;
  app.innerHTML=`
  <h1>הגדרות התחרות</h1>
  <p class="muted">כמה החלטות קטנות, ואחר כך כל השאר רץ לבד.</p>
  <div class="card stack">
    ${locked?'<div class="warn-box">התחרות כבר התחילה — אפשר לשנות רק שולחנות, מודל פיזור ומנוחה.</div>':''}
    <div class="grid2">
      <div><label>שם התחרות</label><input id="s_name" value="${esc(s.name)}" placeholder="למשל: גביע הקיבוץ 2026" ${locked?'disabled':''}></div>
      <div><label>תאריך</label><input id="s_date" type="date" value="${s.date}" ${locked?'disabled':''}></div>
    </div>
    <div><label>סוג התחרות</label>
      <div class="radio-group">
        ${[['singles','יחידים'],['doubles','זוגות']].map(([v,l])=>`<label class="chip ${s.format===v?'on':''}"><input type="radio" name="fmt" value="${v}" ${s.format===v?'checked':''} ${locked?'disabled':''} onchange="setFmt(this.value)">${l}</label>`).join('')}
        <label class="chip" style="opacity:.5" title="בגרסה הבאה">קבוצתי (קורביון) — בקרוב</label>
      </div>
      <div class="hint">בזוגות מזינים כל זוג כשם אחד (למשל "דני / יוסי").</div>
    </div>

/* ---------- Draw (snake seeding) ---------- */
function makeDraw(keepManual){
  const n=S.players.length;const gs=S.settings.groupSize;
  let ng=Math.max(1,Math.round(n/gs));
  const s1=S.players.filter(p=>p.seed===1).length;if(s1>ng)ng=s1;
  if(n/ng<3&&ng>1)ng=Math.max(1,Math.floor(n/3));
  buildGroups(ng);goto('draw');
}
function buildGroups(ng){
  const groups=[];for(let i=0;i<ng;i++)groups.push({id:uid(),name:'בית '+String.fromCharCode(65+i),pids:[]});
  const bySeed=s=>shuffle(S.players.filter(p=>p.seed===s));
  const seeds=[...bySeed(1),...bySeed(2),...bySeed(3)];
  // snake
  let dir=1,gi=0;
  seeds.forEach((p,i)=>{groups[gi].pids.push(p.id);if(dir===1){if(gi===ng-1)dir=-1;else gi++}else{if(gi===0)dir=1;else gi--}});
  // unseeded: balanced random with club separation
  const rest=shuffle(S.players.filter(p=>p.seed===0));
  for(const p of rest){
    const minLen=Math.min(...groups.map(g=>g.pids.length));
    let cands=groups.filter(g=>g.pids.length===minLen);
    const noClub=cands.filter(g=>!p.club||!g.pids.some(id=>P(id).club&&P(id).club===p.club));
    if(noClub.length)cands=noClub;
    cands[Math.floor(Math.random()*cands.length)].pids.push(p.id);
  }
  S.groups=groups;
}

/* ---------- Group schedule (circle method, 1v2 last) ---------- */
function groupSchedule(n){
  const ids=[];for(let i=1;i<=n;i++)ids.push(i);if(n%2)ids.push(0);
  const m=ids.length,rounds=[];let arr=ids.slice();
  for(let r=0;r<m-1;r++){const rm=[];for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a&&b)rm.push([a,b])}rounds.push(rm);arr=[arr[0],arr[m-1],...arr.slice(1,m-1)]}
  const li=rounds.findIndex(r=>r.some(([a,b])=>(a===1&&b===2)||(a===2&&b===1)));if(li>=0){const x=rounds.splice(li,1)[0];rounds.push(x)}
  return rounds;
}
function seedOrderInGroup(g){return g.pids.slice().sort((a,b)=>{const sa=P(a).seed||9,sb=P(b).seed||9;return sa-sb})}
function confirmDraw(){
  S.matches=[];
  for(const g of S.groups){
    const order=seedOrderInGroup(g);
    groupSchedule(order.length).forEach((rm,ri)=>rm.forEach(([a,b])=>S.matches.push(newMatch({stage:'group',groupId:g.id,round:ri+1,p1:order[a-1],p2:order[b-1]}))));
  }
  syncTables();applyModelLocks();S.lastPlayed={};S.phaseStart=Date.now();
  logEv('ההגרלה אושרה');goto('live');
  if(S.settings.auto)autoDistribute();
}
function newMatch(o){return Object.assign({id:uid(),sets:[],status:'pending',table:null,winner:null,wo:false,startedAt:null,endedAt:null},o)}
function applyModelLocks(){
  const m=S.settings.model;
  if(m==='pool'){S.tables.forEach(t=>t.lock=null);return}
  if(m==='group'){
    S.tables.forEach(t=>t.lock=null);
    const gs=S.groups.slice();
    gs.forEach((g,i)=>{if(S.tables[i])S.tables[i].lock=g.id});
    // extras to largest groups
    const extra=S.tables.slice(gs.length);const byLen=gs.slice().sort((a,b)=>b.pids.length-a.pids.length);
    extra.forEach((t,i)=>t.lock=byLen[i%byLen.length].id);
  }
}

/* ========================= ENGINE: results & standings ========================= */
function setsWon(m){let a=0,b=0;for(const [x,y] of m.sets){if(x>y)a++;else if(y>x)b++}return [a,b]}
function validSet(a,b){if(a==null||b==null||isNaN(a)||isNaN(b))return false;const hi=Math.max(a,b),lo=Math.min(a,b);if(hi<11)return false;if(hi===11)return lo<=9;return hi-lo===2}
function otherScore(v){if(v<=9)return 11;if(v===10)return 12;return v+2}
function playerStats(pid,ms){
  let mp=0,w=0,l=0,sw=0,sl=0,pw=0,pl=0,played=0;
  for(const m of ms){if(m.status!=='done')continue;const me=m.p1===pid?0:m.p2===pid?1:-1;if(me<0)continue;played++;
    const [a,b]=setsWon(m);const ws=me?b:a,ls=me?a:b;sw+=ws;sl+=ls;
    for(const [x,y] of m.sets){pw+=me?y:x;pl+=me?x:y}
    if(m.winner===pid){w++;mp+=2}else{l++;mp+=(m.wo||m.retired===pid)?0:1}}
  return {mp,w,l,sw,sl,pw,pl,played,sr:sl?sw/sl:(sw?Infinity:0),pr:pl?pw/pl:(pw?Infinity:0)};
}
function rankGroup(gid){
  const g=G(gid);const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===gid);
  const explain={};g.pids.forEach(id=>explain[id]=[]);
  const order=resolve(g.pids.slice(),ms,explain,gid,0);
  return {order,explain,stats:Object.fromEntries(g.pids.map(id=>[id,playerStats(id,ms)]))};
}
function resolve(pids,ms,explain,gid,depth){
  if(pids.length===1)return pids;
  const sub=ms.filter(m=>m.status==='done'&&pids.includes(m.p1)&&pids.includes(m.p2));
  const st={};pids.forEach(id=>st[id]=playerStats(id,sub));
  const crit=[['mp','נקודות משחק',id=>st[id].mp],['sr','יחס מערכות',id=>st[id].sr],['pr','יחס נקודות',id=>st[id].pr]];
  const scope=depth===0?'':' (רק במשחקים בין השווים)';
  for(const [k,label,f] of crit){
    const vals=new Set(pids.map(f));
    const fmt=id=>k==='mp'?st[id].mp:k==='sr'?`${st[id].sw}:${st[id].sl}`:`${st[id].pw}:${st[id].pl}`;
    if(vals.size===1){if(depth>0||k!=='mp')pids.forEach(id=>explain[id].push(`${label}${scope}: ${fmt(id)} — שווה, ממשיכים לשובר הבא`));continue}
    const sorted=pids.slice().sort((a,b)=>f(b)-f(a));
    const parts=[];for(const id of sorted){const v=f(id);const last=parts[parts.length-1];if(last&&f(last[0])===v)last.push(id);else parts.push([id])}
    if(depth>0||k!=='mp')pids.forEach(id=>explain[id].push(`${label}${scope}: ${fmt(id)} — הכריע`));
    if(parts.length===1)continue;
    let out=[];
    for(const part of parts){
      if(part.length===1)out.push(part[0]);
      else{part.forEach(id=>explain[id].push(`עדיין שוויון בין ${part.map(pname).join(', ')} — מתחילים מחדש רק ביניהם`));out=out.concat(resolve(part,ms,explain,gid,depth+1))}
    }
    return out;
  }
  // full tie -> lot
  const key=gid+':'+pids.slice().sort().join(',');
  if(!S.lots[key]){S.lots[key]=shuffle(pids.slice());save()}
  const lot=S.lots[key].filter(id=>pids.includes(id));
  pids.forEach(id=>explain[id].push('שוויון מוחלט — המיקום נקבע בהגרלה'));
  return lot;
}
function groupDone(gid){return S.matches.filter(m=>m.stage==='group'&&m.groupId===gid).every(m=>m.status==='done')}
function allGroupsDone(){return S.matches.some(m=>m.stage==='group')&&S.matches.filter(m=>m.stage==='group').every(m=>m.status==='done')}

/* ========================= ENGINE: scheduling ========================= */
function busyPids(){const s=new Set();for(const m of S.matches)if(m.status==='playing'){s.add(m.p1);s.add(m.p2)}return s}
function idleSince(pid){return S.lastPlayed[pid]||S.phaseStart||Date.now()}
function pendingMatches(){return S.matches.filter(m=>m.status==='pending'&&m.p1&&m.p2)}
function groupProgress(gid){const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===gid);return ms.length?ms.filter(m=>m.status==='done').length/ms.length:1}
function priority(m,now){
  const why=[];let sc=0;
  if(m.stage==='group'){
    const minRound=Math.min(...pendingMatches().filter(x=>x.stage==='group').map(x=>x.round));
    sc-=100*(m.round-minRound);why.push('סיבוב '+m.round);
    const maxP=Math.max(...S.groups.map(g=>groupProgress(g.id)));const lag=maxP-groupProgress(m.groupId);
    if(lag>0.01){sc+=30*lag*4;why.push(G(m.groupId).name+' מפגר')}
  }else{sc-=100*m.koRound;why.push(m.bracket==='cons'?'ניחומים':'נוקאאוט'+' · '+koRoundName(m))}
  const idle=Math.max(now-idleSince(m.p1),now-idleSince(m.p2));sc+=2*mins(idle);
  const restMs=S.settings.restMin*60000;const lastEnd=Math.max(S.lastPlayed[m.p1]||0,S.lastPlayed[m.p2]||0);
  const owes=m.owes;if(owes){sc+=40;why.push('חייב משחקים')}
  else if(lastEnd&&now-lastEnd<restMs){sc-=60;m._rest=true;why.push('במנוחה')}
  if(idle>0)why.push('ממתין '+mins(idle)+' דק׳');
  return {sc,why};
}
function candidatesFor(table){
  const now=Date.now();const busy=busyPids();
  let c=pendingMatches().filter(m=>!busy.has(m.p1)&&!busy.has(m.p2));
  if(table.lock&&S.matches.some(m=>m.stage==='group'&&m.status!=='done'))c=c.filter(m=>m.groupId===table.lock);
  c=c.map(m=>({m,...priority(m,now)}));
  const nonRest=c.filter(x=>!x.m._rest);if(nonRest.length)c=nonRest;
  c.forEach(x=>delete x.m._rest);
  c.sort((a,b)=>b.sc-a.sc||(a.m.round||0)-(b.m.round||0));
  return c;
}
function startOn(table,m){table.matchId=m.id;m.table=table.n;m.status='playing';m.startedAt=Date.now();logEv(`${pname(m.p1)} – ${pname(m.p2)} לשולחן ${table.n}`)}
function distribute(){
  let n=0;for(const t of S.tables){if(t.matchId)continue;const c=candidatesFor(t);if(c.length){startOn(t,c[0].m);n++}}
  return n;
}

function estimateFinish(){

}

      if(v!==null&&v>=0){const ov=other.value===''?null:+other.value;if(ov===null||!validSet(v,ov)||(ov!==null&&ov<v&&v<=10))other.value=otherScore(v);}

function readSets(m){const need=needSets(m);const bo=need*2-1;const sets=[];for(let i=0;i<bo;i++){const a=document.getElementById('a'+i),b=document.getElementById('b'+i);if(!a)break;if(a.value===''&&b.value==='')sets.push(null);else sets.push([+a.value,+b.value])}return sets}
function refreshSets(m){
  const need=needSets(m);const sets=readSets(m);let a=0,b=0,err='';
  sets.forEach((s,i)=>{const ia=document.getElementById('a'+i),ib=document.getElementById('b'+i);
    const decided=a>=need||b>=need;ia.disabled=ib.disabled=decided;
    if(decided){ia.value='';ib.value='';return}
    if(!s){ia.classList.remove('bad');ib.classList.remove('bad');return}
    const ok=validSet(s[0],s[1]);ia.classList.toggle('bad',!ok);ib.classList.toggle('bad',!ok);if(!ok)err='מערכה '+(i+1)+' לא חוקית (11 נק׳, או הפרש 2 אחרי 10:10)';
    if(ok){if(s[0]>s[1])a++;else b++}});

  const done=(a>=need||b>=need)&&!err;

function quickFill(mid,side){const m=S.matches.find(x=>x.id===mid);const need=needSets(m);for(let i=0;i<need;i++){document.getElementById('a'+i).value=side?0:11;document.getElementById('b'+i).value=side?11:0}refreshSets(m)}
function finishMatch(m,winner,sets,flags){

function walkover(mid,absent){const m=S.matches.find(x=>x.id===mid);if(!confirm(`${pname(absent)} לא הגיע/ה — ניצחון טכני ל${pname(absent===m.p1?m.p2:m.p1)}?`))return;const need=needSets(m);const w=absent===m.p1?m.p2:m.p1;const sets=[];for(let i=0;i<need;i++)sets.push(w===m.p1?[11,0]:[0,11]);finishMatch(m,w,sets,{wo:true,retired:null})}

function showExplain(gid,pid){const r=rankGroup(gid);const i=r.order.indexOf(pid);modal(`<h2>${esc(pname(pid))} — מקום ${i+1} ב${G(gid).name}</h2><p class="muted">לפי תקנון ITTF 3.7.5: נקודות משחק, ואז רק המשחקים בין השווים — נקודות משחק, יחס מערכות, יחס נקודות.</p><div class="explain"><ul style="margin:0;padding-right:18px">${r.explain[pid].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="row" style="margin-top:14px"><button onclick="closeModal()">סגור</button></div>`)}

/* ---------- Late entry ---------- */
function lateEntry(){
  const options=[];
  const groupsSorted=S.groups.slice().sort((a,b)=>a.pids.length-b.pids.length);
  for(const g of groupsSorted){
    const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===g.id);
    const r1done=ms.filter(m=>m.round===1).every(m=>m.status==='done');
    const finished=ms.every(m=>m.status==='done');
    if(finished)continue;

function seedSlots(n){let a=[1];while(a.length<n){const m=a.length*2+1;const b=[];for(const x of a){b.push(x,m-x)}a=b}return a}// slot order: position i -> seed number
function buildKO(){
  if(!allGroupsDone())return;
  const ranks=S.groups.map(g=>rankGroup(g.id).order);
  const adv=S.settings.advance;
  const main=[],cons=[];
  ranks.forEach((ord,gi)=>ord.forEach((pid,pos)=>{(pos<adv?main:cons).push({pid,g:gi,pos})}));
  S.matches=S.matches.filter(m=>m.stage!=='ko');
  S.koRounds=buildBracket(main,'main');
  if(S.settings.consolation&&cons.length>=2)S.consRounds=buildBracket(cons,'cons');
  S.koBuilt=true;S.tables.forEach(t=>t.lock=null);S.phaseStart=Date.now();S.tab='bracket';
  logEv('נבנה עץ הנוקאאוט');commit();autoDistribute();
}
function buildBracket(entrants,bracket){
  if(entrants.length<2)return 0;
  const size=Math.pow(2,Math.ceil(Math.log2(entrants.length)));const rounds=Math.log2(size);
  // seed ranking: winners by group order, then pos2 by group order, etc.
  const byPos={};entrants.forEach(e=>(byPos[e.pos]=byPos[e.pos]||[]).push(e));
  const positions=Object.keys(byPos).map(Number).sort();
  const slots=seedSlots(size);// slots[i] = seed rank at position i (1-based seed)
  const posOf=new Array(size).fill(null);
  const seedPos=r=>slots.indexOf(r);
  let rank=1;
  // place first tier (group winners) by group order, then random constrained for others
  const first=byPos[positions[0]].slice().sort((a,b)=>a.g-b.g);
  // ITTF: winner G1 top, G2 bottom, G3/G4 drawn into quarters, etc.
  const tiers=[];{let t=[first[0]],i=1;const out=[t];while(i<first.length){const sz=out.length;const tier=[];const cand=shuffle(first.slice(i,i+sz));for(const c of cand)tier.push(c);out.push(tier);i+=sz}for(const tr of out)for(const c of tr){posOf[seedPos(rank++)]=c}}
  for(const pos of positions.slice(1)){
    const list=byPos[pos];let best=null,bestScore=-1;
    for(let attempt=0;attempt<300;attempt++){
      const perm=shuffle(list.slice());const trial=posOf.slice();let r=rank;perm.forEach(e=>trial[seedPos(r++)]=e);
      let score=0;
      for(let i=0;i<size;i++){const e=trial[i];if(!e||e.pos!==pos)continue;
        const half=i<size/2;const w=trial.findIndex(x=>x&&x.g===e.g&&x.pos<e.pos);
        if(w>=0&&(w<size/2)!==half)score+=10;// opposite half from own group's higher finisher
        const opp=trial[i^1];if(opp&&opp.pos===e.pos)score-=3;// avoid same-tier in round 1
        if(opp&&opp.g===e.g)score-=20;// never same group in round 1
        if(opp&&P(opp.pid).club&&P(opp.pid).club===P(e.pid).club)score-=2;
      }
      if(score>bestScore){bestScore=score;best=trial}
      if(score>=10*list.length)break;
    }
    for(let i=0;i<size;i++)posOf[i]=best[i];rank+=list.length;
  }
  // create matches
  const ms=[];
  for(let r=0;r<rounds;r++){const n=size/Math.pow(2,r+1);for(let i=0;i<n;i++)ms.push(newMatch({stage:'ko',bracket,koRound:r,koIndex:i,p1:null,p2:null}))}
  const at=(r,i)=>ms.find(m=>m.koRound===r&&m.koIndex===i);
  for(let i=0;i<size;i+=2){const m=at(0,i/2);m.p1=posOf[i]?posOf[i].pid:null;m.p2=posOf[i+1]?posOf[i+1].pid:null;m.bye1=!posOf[i];m.bye2=!posOf[i+1]}
  S.matches.push(...ms);
  if(S.settings.third&&bracket==='main'&&rounds>=2)S.matches.push(newMatch({stage:'ko',bracket,koRound:rounds-1,koIndex:1,third:true,p1:null,p2:null}));
  // resolve byes
  ms.filter(m=>m.koRound===0).forEach(m=>{if(m.p1&&!m.p2){m.status='done';m.winner=m.p1;m.bye=true;advanceKO(m)}else if(m.p2&&!m.p1){m.status='done';m.winner=m.p2;m.bye=true;advanceKO(m)}else if(!m.p1&&!m.p2){m.status='done';m.bye=true}});

}
function advanceKO(m){
  const rounds=m.bracket==='main'?S.koRounds:S.consRounds;

  if(nxt){if(m.koIndex%2===0)nxt.p1=m.winner;else nxt.p2=m.winner;
    if(nxt.status==='pending'&&((nxt.p1&&!nxt.p2&&nxt.bye2)||(nxt.p2&&!nxt.p1&&nxt.bye1))){nxt.status='done';nxt.winner=nxt.p1||nxt.p2;nxt.bye=true;advanceKO(nxt)}}
  if(m.koRound===rounds-2&&m.bracket==='main'&&S.settings.third){const t=S.matches.find(x=>x.stage==='ko'&&x.third);if(t&&m.winner){const loser=m.winner===m.p1?m.p2:m.p1;if(m.koIndex===0)t.p1=loser;else t.p2=loser}}
}
function koHasDownstream(m){const nxt=S.matches.find(x=>x.stage==='ko'&&x.bracket===m.bracket&&!x.third&&x.koRound===m.koRound+1&&x.koIndex===Math.floor(m.koIndex/2));return nxt&&nxt.status!=='pending'}

function koRoundName(m){const rounds=m.bracket==='main'?S.koRounds:S.consRounds;if(m.third)return 'מקום 3';const left=rounds-m.koRound;return left===1?'גמר':left===2?'חצי גמר':left===3?'רבע גמר':`שמינית (${Math.pow(2,left)})`}

function bracketTab(){

function finalRanking(){
  const res=[];const main=S.matches.filter(m=>m.stage==='ko'&&m.bracket==='main'&&!m.third);
  const eliminatedAt={};for(const m of main){if(m.status!=='done'||m.bye)continue;const l=m.winner===m.p1?m.p2:m.p1;eliminatedAt[l]=m.koRound}
  const finalM=main.find(m=>m.koRound===S.koRounds-1);
  const groupRank={};S.groups.forEach(g=>rankGroup(g.id).order.forEach((id,i)=>groupRank[id]=i));
  const third=S.matches.find(m=>m.stage==='ko'&&m.third&&m.status==='done');
  const players=S.players.slice();
  const tier=id=>{if(finalM&&finalM.winner===id)return 0;if(finalM&&finalM.status==='done'&&(finalM.p1===id||finalM.p2===id))return 1;
    if(third){if(third.winner===id)return 2;if(third.p1===id||third.p2===id)return 3}
    if(eliminatedAt[id]!=null)return 10+ (S.koRounds-eliminatedAt[id]);
    const inMain=main.some(m=>m.p1===id||m.p2===id);if(inMain)return 10;
    const cons=S.matches.filter(m=>m.stage==='ko'&&m.bracket==='cons');const cf=cons.find(m=>m.koRound===S.consRounds-1);
    if(cf&&cf.winner===id)return 50;if(cf&&cf.status==='done'&&(cf.p1===id||cf.p2===id))return 51;
    const ce={};for(const m of cons){if(m.status!=='done'||m.bye)continue;const l=m.winner===m.p1?m.p2:m.p1;ce[l]=m.koRound}
    if(ce[id]!=null)return 60+(S.consRounds-ce[id]);return 100};
  players.sort((a,b)=>tier(a.id)-tier(b.id)||groupRank[a.id]-groupRank[b.id]);

}

    const d=snap.data();if(!d.state)return;
    if(d.client===CLIENT&&(d.rev||0)<=(S.rev||0))return;
    if((d.rev||0)>(S.rev||0)||!S.settings.name&&!S.players.length){try{const st=JSON.parse(d.state);S=Object.assign(fresh(),st);S.rev=d.rev||0;localStorage.setItem(KEY+'.'+id,d.state);closeModal();render()}catch(e){console.error(e)}}
    setDot('#4CAF50');
  },e=>{console.error(e);setDot('#C8412B');toast('אין חיבור לענן — עובדים מקומית')});
  render();
}
function closeTournament(silent){if(unsubT){unsubT();unsubT=null}if(cloudT){clearTimeout(cloudT);pushCloud()}TID=null;S=fresh();if(!silent)render()}
function scheduleCloud(){setDot('#F28C28');clearTimeout(cloudT);cloudT=setTimeout(pushCloud,400)}
async function pushCloud(force){
  if(!TID||!USER)return;cloudT=null;
  const body={name:S.settings.name||'',date:S.settings.date||'',phase:S.phase,playersCount:S.players.length,rev:S.rev||0,client:CLIENT,state:JSON.stringify(S),updatedAt:Date.now(),updatedBy:USER.uid};
  if(force)body.createdBy=USER.uid;
  try{await FB.setDoc(FB.doc(FB.db,'tournaments',TID),body,{merge:true});setDot('#4CAF50')}catch(e){console.error(e);setDot('#C8412B');toast('השמירה לענן נכשלה — הנתונים שמורים בטלפון')}
}
function setDot(c){const d=document.getElementById('syncDot');if(d)d.style.background=c}
async function deleteTournament(id,name){if(!confirm(`למחוק את "${name}"?`))return;if(!confirm('בטוח? המחיקה סופית.'))return;try{await FB.deleteDoc(FB.doc(FB.db,'tournaments',id));localStorage.removeItem(KEY+'.'+id)}catch(e){toast('המחיקה נכשלה')}}
/* import players from attendance app */
async function importFromClub(){
  modal('<h2>ייבוא מאפליקציית הנוכחות</h2><p class="muted">טוען…</p>');
  try{
    const [ps,gs]=await Promise.all([FB.getDocs(FB.collection(FB.db,'players')),FB.getDocs(FB.collection(FB.db,'groups'))]);
    const groups={};gs.forEach(d=>groups[d.id]=d.data().name||'');
    const players=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.isActive!==false&&p.name).sort((a,b)=>(groups[a.groupId]||'').localeCompare(groups[b.groupId]||'')||a.name.localeCompare(b.name));
    const byG={};players.forEach(p=>(byG[groups[p.groupId]||'ללא קבוצה']=byG[groups[p.groupId]||'ללא קבוצה']||[]).push(p));
    modal(`<h2>ייבוא מאפליקציית הנוכחות</h2><p class="muted">סמנו את המשתתפים. שם הקבוצה נשמר כ"מועדון" — כך ההגרלה מפרידה חברי קבוצה לבתים שונים.</p>
    <div style="max-height:55vh;overflow:auto">${Object.entries(byG).map(([g,list])=>`<div style="margin-top:10px"><label class="chip" style="font-weight:700"><input type="checkbox" onchange="this.closest('div').querySelectorAll('.pi').forEach(c=>c.checked=this.checked)">${esc(g)} (${list.length})</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${list.map(p=>`<label class="chip"><input type="checkbox" class="pi" value="${p.id}" data-name="${esc(p.name)}" data-club="${esc(g)}" ${S.players.some(x=>x.name===p.name)?'checked disabled':''}>${esc(p.name)}</label>`).join('')}</div></div>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="primary" onclick="doImport()">הוסף את המסומנים</button><button class="ghost" onclick="closeModal()">ביטול</button></div>`);
  }catch(e){console.error(e);modal('<h2>ייבוא</h2><div class="err-box">לא הצלחתי לקרוא את רשימת השחקנים. בדקו הרשאות ב-Firestore.</div><div class="row" style="margin-top:12px"><button onclick="closeModal()">סגור</button></div>')}
}
function doImport(){let n=0;document.querySelectorAll('.pi:checked:not(:disabled)').forEach(c=>{if(S.players.some(p=>p.name===c.dataset.name))return;S.players.push({id:uid(),name:c.dataset.name,club:c.dataset.club,seed:0,clubPlayerId:c.value});n++});closeModal();commit();toast(`נוספו ${n} שחקנים`)}

/* ========================= PUBLIC DISPLAY ========================= */
let pubTimer=null;
function openPublic(){const el=document.getElementById('public');const draw=()=>{const now=Date.now();const busy=busyPids();const q=pendingMatches().filter(m=>!busy.has(m.p1)&&!busy.has(m.p2)).map(m=>({m,...priority(m,now)}));q.forEach(x=>delete x.m._rest);q.sort((a,b)=>b.sc-a.sc);
  el.innerHTML=`<div class="public"><h1><span>${esc(S.settings.name)||'תן לי שולחן'}</span><button class="ghost" style="color:#fff;font-size:16px" onclick="closePublic()">✕ סגור</button></h1>
  <div class="tables">${S.tables.map(t=>{const m=t.matchId?S.matches.find(x=>x.id===t.matchId):null;return m?`<div class="table"><div class="tnum"><span>שולחן ${t.n}</span><span>${matchLabel(m)}</span></div><div class="players">${esc(pname(m.p1))}<span class="vs">נגד</span>${esc(pname(m.p2))}</div><div class="meta"></div></div>`:`<div class="table free"><div class="tnum"><span>שולחן ${t.n}</span></div><div class="free-lbl">פנוי</div><div class="meta"></div></div>`}).join('')}</div>
  <div class="next"><h2>להתכונן — הבאים בתור</h2><ul style="padding:0;margin:0">${q.slice(0,6).map(x=>`<li><span>${esc(pname(x.m.p1))} נגד ${esc(pname(x.m.p2))}</span><small>${matchLabel(x.m)}</small></li>`).join('')||'<li>אין משחקים ממתינים</li>'}</ul></div></div>`};
  draw();pubTimer=setInterval(draw,15000);if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
}
function closePublic(){clearInterval(pubTimer);document.getElementById('public').innerHTML='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}

/* ========================= UI helpers ========================= */
function modal(html){document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
let toastT=null;
function toast(msg,action){const t=document.getElementById('toast');t.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${action?`<button id="toastBtn">${action.label}</button>`:''}</div>`;if(action)document.getElementById('toastBtn').onclick=action.fn;clearTimeout(toastT);toastT=setTimeout(hideToast,action?10000:3000)}
function hideToast(){document.getElementById('toast').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
