/* ---------- Late entry ---------- */
function lateEntry(){
  const options=[];
  const groupsSorted=S.groups.slice().sort((a,b)=>a.pids.length-b.pids.length);
  for(const g of groupsSorted){
    const ms=S.matches.filter(m=>m.stage==='group'&&m.groupId===g.id);
    const r1done=ms.filter(m=>m.round===1).every(m=>m.status==='done');
    const finished=ms.every(m=>m.status==='done');
    if(finished)continue;
    const size=g.pids.length;const warn=[];
    if(size>=S.settings.groupSize)warn.push(`הבית יגדל ל-${size+1}`);
    if(r1done)warn.push('הבית כבר סיים סיבוב ראשון');
    if(size>=6)continue;
    options.push({g,warn,newMatches:size,estMin:mins(avgDuration(S.settings.boGroup)*size)});
  }
  modal(`<h2>שחקן מאוחר</h2><p class="muted">השחקן ישחק נגד כל חברי הבית. משחקים שכבר שוחקו לא משתנים.</p>
  <label>שם</label><input id="le_name"><label>מועדון (לא חובה)</label><input id="le_club">
  <label>לאיזה בית?</label>
  <div class="radio-group">${options.map((o,i)=>`<label class="chip ${i===0?'on':''}"><input type="radio" name="leg" value="${o.g.id}" ${i===0?'checked':''} onchange="[...document.querySelectorAll('input[name=leg]')].forEach(x=>x.closest('.chip').classList.toggle('on',x.checked))">${o.g.name} (${o.g.pids.length})</label>`).join('')}
    <label class="chip"><input type="radio" name="leg" value="__new" onchange="[...document.querySelectorAll('input[name=leg]')].forEach(x=>x.closest('.chip').classList.toggle('on',x.checked))">בית חדש</label></div>
  <div class="explain" style="margin-top:10px">${options.map(o=>`<div><b>${o.g.name}:</b> +${o.newMatches} משחקים, כ-${o.estMin} דק׳ נוספות${o.warn.length?` · <span style="color:var(--warn)">${o.warn.join(' · ')}</span>`:' · מומלץ'}</div>`).join('')||'כל הבתים הסתיימו — אפשר רק בית חדש (שחקן אחד לבדו לא יכול לשחק; הוסיפו לפחות 3).'}</div>
  <div class="row" style="margin-top:16px"><button class="primary" onclick="doLateEntry()">הוסף</button><button class="ghost" onclick="closeModal()">ביטול</button></div>`);
}
function doLateEntry(){
  const name=document.getElementById('le_name').value.trim();if(!name){toast('צריך שם');return}if(S.players.some(p=>p.name===name)){toast('כבר יש שחקן בשם הזה');return}
  const club=document.getElementById('le_club').value.trim();const gid=document.querySelector('input[name=leg]:checked')?.value;if(!gid)return;
  const p={id:uid(),name,club,seed:0,late:true};S.players.push(p);
  let g;
  if(gid==='__new'){g={id:uid(),name:'בית '+String.fromCharCode(65+S.groups.length),pids:[]};S.groups.push(g);g.pids.push(p.id);toast('נפתח '+g.name+'. הוסיפו אליו עוד שחקנים — משחקים ייווצרו כשיהיו לפחות 2.')}
  else{g=G(gid);g.pids.push(p.id);
    // if group had <2 matches (new late group), rebuild all matches for it; else add only new ones
    const existing=S.matches.filter(m=>m.stage==='group'&&m.groupId===g.id);
    if(existing.some(m=>m.status!=='pending')||existing.length){
      const maxRound=Math.max(0,...existing.map(m=>m.round));
      g.pids.filter(x=>x!==p.id).forEach((opp,i)=>S.matches.push(newMatch({stage:'group',groupId:g.id,round:Math.max(1,Math.min(maxRound,i+1)),p1:opp,p2:p.id,owes:true})));
    }else{
      const order=g.pids;groupSchedule(order.length).forEach((rm,ri)=>rm.forEach(([a,b])=>S.matches.push(newMatch({stage:'group',groupId:g.id,round:ri+1,p1:order[a-1],p2:order[b-1],owes:true}))));
    }
  }
  if(S.settings.model==='group'&&!S.tables.some(t=>t.lock===g.id)){const free=S.tables.find(t=>!t.lock);if(free)free.lock=g.id}
  logEv(`שחקן מאוחר: ${name} נכנס ל${g.name}`,'player');closeModal();commit();autoDistribute();
}


/* ========================= SWISS ========================= */
function startSwiss(){
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.byes=[];S.koBuilt=false;syncTables();S.tables.forEach(t=>t.lock=null);
  S.lastPlayed={};S.phaseStart=Date.now();S.tab='tables';
  if(!S.settings.swissRounds)S.settings.swissRounds=suggestSwissRounds(S.players.length);
  swissNextRound();logEv(`התחילה תחרות שוויצרית — ${S.settings.swissRounds} סיבובים`,'start');goto('live');if(S.settings.auto)autoDistribute();
}
function swissStandings(){
  const ms=S.matches.filter(m=>m.stage==='swiss');
  const st={};S.players.forEach(p=>st[p.id]=Object.assign({id:p.id,opp:[]},playerStats(p.id,ms)));
  ms.filter(m=>m.status==='done'&&m.p1&&m.p2).forEach(m=>{if(st[m.p1])st[m.p1].opp.push(m.p2);if(st[m.p2])st[m.p2].opp.push(m.p1)});
  Object.values(st).forEach(x=>x.buch=x.opp.reduce((a,o)=>a+(st[o]?st[o].mp:0),0));
  return Object.values(st).sort((a,b)=>b.mp-a.mp||b.buch-a.buch||(b.sw-b.sl)-(a.sw-a.sl)||(b.pw-b.pl)-(a.pw-a.pl)||pname(a.id).localeCompare(pname(b.id)));
}
function swissRoundsDone(){const ms=S.matches.filter(m=>m.stage==='swiss');return ms.length?Math.max(...ms.map(m=>m.round)):0}
function swissNextRound(){
  const done=swissRoundsDone();
  if(done>=S.settings.swissRounds)return 0;
  const played=new Set();S.matches.filter(m=>m.stage==='swiss'&&m.p1&&m.p2).forEach(m=>{played.add(m.p1+'|'+m.p2);played.add(m.p2+'|'+m.p1)});
  let pool = done===0 ? S.players.slice().sort((a,b)=>(a.seed||9)-(b.seed||9)).map(p=>p.id) : swissStandings().map(x=>x.id);
  let bye=null;
  if(pool.length%2){for(let i=pool.length-1;i>=0;i--){if(!(S.byes||[]).includes(pool[i])){bye=pool[i];break}}if(!bye)bye=pool[pool.length-1];pool=pool.filter(x=>x!==bye)}
  let pairs;
  if(done===0){pairs=[];const h=pool.length/2;for(let i=0;i<h;i++)pairs.push([pool[i],pool[i+h]])}
  else pairs=swissPair(pool,played)||fallbackPair(pool);
  pairs.forEach(([a,b])=>S.matches.push(newMatch({stage:'swiss',round:done+1,p1:a,p2:b})));
  if(bye){S.byes=(S.byes||[]).concat(bye);const m=newMatch({stage:'swiss',round:done+1,p1:bye,p2:null});m.status='done';m.winner=bye;m.bye=true;S.matches.push(m);logEv(pname(bye)+' קיבל/ה בוחן (Bye) בסיבוב '+(done+1))}
  logEv('נוצר סיבוב '+(done+1),'round');
  return pairs.length;
}
function swissPair(pool,played,depth){
  if(!pool.length)return [];
  if((depth||0)>400)return null;
  const a=pool[0];
  for(let i=1;i<pool.length;i++){
    const b=pool[i];if(played.has(a+'|'+b))continue;
    const rest=swissPair(pool.filter((x,j)=>j!==0&&j!==i),played,(depth||0)+1);
    if(rest)return [[a,b],...rest];
  }
  return null;
}
function fallbackPair(pool){const out=[];for(let i=0;i<pool.length-1;i+=2)out.push([pool[i],pool[i+1]]);return out}
function swissTab(){
  const st=swissStandings();const r=swissRoundsDone();const ms=S.matches.filter(m=>m.stage==='swiss');
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>טבלה</h2><span class="tiny">סיבוב ${r} מתוך ${S.settings.swissRounds}</span></div>
  <div style="overflow-x:auto"><table class="st"><tr><th>#</th><th style="text-align:right">שם</th><th>מש׳</th><th>נצ׳</th><th>הפ׳</th><th>נק׳</th><th>בוכהולץ</th><th>מערכות</th><th>נקודות</th></tr>
  ${st.map((x,i)=>`<tr data-pid="${x.id}" class="${S.settings.swissKO&&i<S.settings.swissAdvance?'q':''}"><td>${i+1}</td><td class="name">${esc(pname(x.id))}</td><td>${x.played}</td><td>${x.w}</td><td>${x.l}</td><td><b>${x.mp}</b></td><td>${x.buch}</td><td>${x.sw}:${x.sl}</td><td>${x.pw}:${x.pl}</td></tr>`).join('')}</table></div>
  <p class="tiny" style="margin-top:8px">בוכהולץ = סכום נקודות המשחק של כל היריבים שלך — שובר השוויון המקובל בשיטה השוויצרית.</p></div>
  <div class="card" style="margin-top:12px"><h2>משחקים</h2>
  ${Array.from({length:r},(_,i)=>i+1).reverse().map(rd=>`<h3 style="margin-top:10px">סיבוב ${rd}</h3><ul class="matchlist">${ms.filter(m=>m.round===rd).map(m=>`<li><span>${esc(pname(m.p1))} ${m.bye?'':'– '+esc(pname(m.p2))}</span><span>${m.bye?'<span class="tiny">בוחן — ניצחון אוטומטי</span>':m.status==='done'?`<span class="sc">${setsWon(m).join(':')}</span> <button class="edit" onclick="openResult('${m.id}')">ערוך</button>`:m.status==='playing'?`<span class="tiny">שולחן ${m.table}</span>`:'<span class="tiny">ממתין</span>'}</span></li>`).join('')}</ul>`).join('')}</div>`;
}

/* ========================= AMERICANO / MEXICANO ========================= */
function startAmericano(){
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.koBuilt=false;syncTables();S.tables.forEach(t=>t.lock=null);
  S.lastPlayed={};S.phaseStart=Date.now();S.tab='tables';
  americanoRound(1);logEv(`התחיל ${SYSTEMS[sys()].n} — ${S.settings.rounds} סיבובים, עד ${S.settings.target} נק׳`,'start');goto('live');if(S.settings.auto)autoDistribute();
}
function amStandings(){
  const st={};S.players.forEach(p=>st[p.id]={id:p.id,pts:0,against:0,g:0,w:0});
  S.matches.filter(m=>m.stage==='round'&&m.status==='done').forEach(m=>{
    const [a,b]=m.score||[0,0];
    sideIds(m,1).forEach(id=>{if(!st[id])return;st[id].pts+=a;st[id].against+=b;st[id].g++;if(a>b)st[id].w++});
    sideIds(m,2).forEach(id=>{if(!st[id])return;st[id].pts+=b;st[id].against+=a;st[id].g++;if(b>a)st[id].w++});
  });
  return Object.values(st).sort((x,y)=>y.pts-x.pts||y.w-x.w||(y.pts-y.against)-(x.pts-x.against)||pname(x.id).localeCompare(pname(y.id)));
}
function americanoRound(r){
  const n=S.players.length;const courts=Math.min(S.settings.tables,Math.floor(n/4));
  if(courts<1){toast('צריך לפחות 4 שחקנים לשולחן אחד');return 0}
  const played={};S.players.forEach(p=>played[p.id]=0);
  const prev=S.matches.filter(m=>m.stage==='round');
  prev.forEach(m=>matchPids(m).forEach(id=>{if(played[id]!=null)played[id]++}));
  let order = (sys()==='mexicano'&&r>1) ? amStandings().map(x=>x.id) : shuffle(S.players.map(p=>p.id));
  const need=courts*4;
  if(order.length>need){
    const bySit=order.slice().sort((a,b)=>played[a]-played[b]);
    const sit=new Set(bySit.slice(need));
    order=order.filter(id=>!sit.has(id));
    S.sitOut=[...sit];
  } else {order=order.slice(0,Math.floor(order.length/4)*4);S.sitOut=S.players.map(p=>p.id).filter(id=>!order.includes(id))}
  const partnered={},opposed={};prev.forEach(m=>{const A=sideIds(m,1),B=sideIds(m,2);[A,B].forEach(t=>{if(t.length===2){partnered[t[0]+'|'+t[1]]=1;partnered[t[1]+'|'+t[0]]=1}});A.forEach(x=>B.forEach(y=>{opposed[x+'|'+y]=(opposed[x+'|'+y]||0)+1;opposed[y+'|'+x]=opposed[x+'|'+y]}))});
  if(!(sys()==='mexicano'&&r>1)){
    let best=null,bestCost=Infinity;
    for(let att=0;att<300;att++){const o=shuffle(order.slice());let cost=0;
      for(let i=0;i<o.length;i+=4){const g=o.slice(i,i+4);const opts=[[[g[0],g[1]],[g[2],g[3]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[3]],[g[1],g[2]]]];
        const c=Math.min(...opts.map(p=>(partnered[p[0][0]+'|'+p[0][1]]?100:0)+(partnered[p[1][0]+'|'+p[1][1]]?100:0)));cost+=c;
        for(let x=0;x<4;x++)for(let y=x+1;y<4;y++)cost+=(opposed[g[x]+'|'+g[y]]||0);}
      if(cost<bestCost){bestCost=cost;best=o;if(cost===0)break}}
    order=best;
  }
  for(let i=0;i<order.length;i+=4){
    const g=order.slice(i,i+4);let t1,t2;
    if(sys()==='mexicano'&&r>1){t1=[g[0],g[3]];t2=[g[1],g[2]]}
    else{
      const opts=[[[g[0],g[1]],[g[2],g[3]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[3]],[g[1],g[2]]]];
      const fresh=opts.find(o=>!partnered[o[0][0]+'|'+o[0][1]]&&!partnered[o[1][0]+'|'+o[1][1]]);
      const pick=fresh||opts[Math.floor(Math.random()*3)];t1=pick[0];t2=pick[1];
    }
    S.matches.push(newMatch({stage:'round',round:r,t1,t2,target:S.settings.target,score:null}));
  }
  logEv('נוצר סיבוב '+r,'round');
  return 1;
}
function amRoundsDone(){const ms=S.matches.filter(m=>m.stage==='round');return ms.length?Math.max(...ms.map(m=>m.round)):0}
function amTab(){
  const st=amStandings();const r=amRoundsDone();const ms=S.matches.filter(m=>m.stage==='round');
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>טבלה אישית</h2><span class="tiny">סיבוב ${r} מתוך ${S.settings.rounds}</span></div>
  <div style="overflow-x:auto"><table class="st"><tr><th>#</th><th style="text-align:right">שם</th><th>משחקים</th><th>נצ׳</th><th>נקודות</th><th>נגד</th><th>הפרש</th></tr>
  ${st.map((x,i)=>`<tr data-pid="${x.id}" class="${i<3?'q':''}"><td>${i+1}</td><td class="name">${esc(pname(x.id))}</td><td>${x.g}</td><td>${x.w}</td><td><b>${x.pts}</b></td><td>${x.against}</td><td>${x.pts-x.against>0?'+':''}${x.pts-x.against}</td></tr>`).join('')}</table></div>
  <p class="tiny" style="margin-top:8px">הנקודות אישיות — מה שצברת נשאר שלך, לא משנה עם מי שיחקת.</p></div>
  <div class="card" style="margin-top:12px"><h2>סיבובים</h2>
  ${Array.from({length:r},(_,i)=>i+1).reverse().map(rd=>`<h3 style="margin-top:10px">סיבוב ${rd}</h3><ul class="matchlist">${ms.filter(m=>m.round===rd).map(m=>`<li><span>${esc(sideName(m,1))} – ${esc(sideName(m,2))}</span><span>${m.status==='done'?`<span class="sc">${(m.score||[]).join(':')}</span> <button class="edit" onclick="openResult('${m.id}')">ערוך</button>`:m.status==='playing'?`<span class="tiny">שולחן ${m.table}</span>`:'<span class="tiny">ממתין</span>'}</span></li>`).join('')}</ul>`).join('')}</div>`;
}

/* ========================= KING OF THE TABLE ========================= */
function startKing(){
  S.tables.forEach(t=>t.matchId=null);S.matches=[];S.koBuilt=false;syncTables();S.tables.forEach(t=>t.lock=null);
  S.lastPlayed={};S.phaseStart=Date.now();S.tab='tables';S.kingCrowns={};S.kingHolders={};
  S.kingQueue=shuffle(S.players.map(p=>p.id));
  logEv(`התחיל מלך השולחן — עד ${S.settings.kingTarget} נק׳`,'start');goto('live');kingFill();commit();
}
function kingFill(){
  let n=0;const busy=busyPids();
  for(const t of S.tables){
    if(t.matchId)continue;
    let a=S.kingHolders[t.n];
    if(a&&(busy.has(a)||!P(a)))a=null;
    let q=S.kingQueue.filter(id=>!busy.has(id)&&P(id));
    if(!a){a=q.shift();if(!a)continue}
    q=S.kingQueue.filter(id=>!busy.has(id)&&P(id)&&id!==a);
    const b=q[0];if(!b)continue;
    S.kingQueue=S.kingQueue.filter(x=>x!==a&&x!==b);busy.add(a);busy.add(b);
    S.kingHolders[t.n]=a;
    const m=newMatch({stage:'king',p1:a,p2:b,target:S.settings.kingTarget,score:null});
    S.matches.push(m);startOn(t,m);n++;
  }
  return n;
}
function kingTab(){
  const cr=S.kingCrowns||{};
  const st=S.players.map(p=>({id:p.id,w:cr[p.id]||0,g:S.matches.filter(m=>m.stage==='king'&&m.status==='done'&&matchPids(m).includes(p.id)).length}))
    .sort((a,b)=>b.w-a.w||a.g-b.g||pname(a.id).localeCompare(pname(b.id)));
  const done=S.matches.filter(m=>m.stage==='king'&&m.status==='done');
  return `<div class="card"><h2>מלכים</h2>
  <div style="overflow-x:auto"><table class="st"><tr><th>#</th><th style="text-align:right">שם</th><th>ניצחונות</th><th>משחקים</th><th>אחוז</th></tr>
  ${st.map((x,i)=>`<tr data-pid="${x.id}" class="${i<3?'q':''}"><td>${i+1}</td><td class="name">${esc(pname(x.id))}${Object.values(S.kingHolders||{}).includes(x.id)?' 👑':''}</td><td><b>${x.w}</b></td><td>${x.g}</td><td>${x.g?Math.round(x.w/x.g*100):0}%</td></tr>`).join('')}</table></div></div>
  <div class="card" style="margin-top:12px"><h2>התור (${(S.kingQueue||[]).length})</h2><div class="row" style="gap:6px;margin-top:6px">${(S.kingQueue||[]).map((id,i)=>`<span class="pill">${i+1}. ${esc(pname(id))}</span>`).join('')||'<span class="muted">ריק</span>'}</div></div>

function buildBracket(entrants,bracket){

  const first=byPos[positions[0]].slice().sort((a,b)=>a.g-b.g);
  // ITTF: winner G1 top, G2 bottom, G3/G4 drawn into quarters, etc.
  const tiers=[];{let t=[first[0]],i=1;const out=[t];while(i<first.length){const sz=out.length;const tier=[];const cand=shuffle(first.slice(i,i+sz));for(const c of cand)tier.push(c);out.push(tier);i+=sz}for(const tr of out)for(const c of tr){posOf[seedPos(rank++)]=c}}

    for(let attempt=0;attempt<300;attempt++){
      const perm=shuffle(list.slice());const trial=posOf.slice();let r=rank;perm.forEach(e=>trial[seedPos(r++)]=e);
      let score=0;
      for(let i=0;i<size;i++){const e=trial[i];if(!e||e.pos!==pos)continue;
        const half=i<size/2;const w=trial.findIndex(x=>x&&x.g===e.g&&x.pos<e.pos);

        const opp=trial[i^1];if(opp&&opp.pos===e.pos)score-=3;// avoid same-tier in round 1
        if(opp&&opp.g===e.g)score-=20;// never same group in round 1
        if(opp&&P(opp.pid).club&&P(opp.pid).club===P(e.pid).club)score-=2;

      if(score>bestScore){bestScore=score;best=trial}

}

async function newTournament(){
  const id=uid()+uid();S=fresh();S.rev=0;TID=id;logEv('נפתחה תחרות חדשה','create');
  const ok=await pushCloud(true);
  openTournament(id);
  if(!ok)setTimeout(diagnostics,400);
}
async function openTournament(id){
  TID=id;const cached=localStorage.getItem(KEY+'.'+id);if(cached){try{S=Object.assign(fresh(),JSON.parse(cached))}catch(e){}}
  const ref=FB.doc(FB.db,'tournaments',id);
  if(unsubT)unsubT();
  unsubT=FB.onSnapshot(ref,snap=>{
    if(!snap.exists()){closeTournament();toast('התחרות נמחקה');return}
    const d=snap.data();if(!d.state)return;
    if(d.client===CLIENT&&(d.rev||0)<=(S.rev||0))return;
    if((d.rev||0)>=(S.rev||0)&&syncState!=='pending'&&syncState!=='saving'){try{const st=JSON.parse(d.state);S=Object.assign(fresh(),st);S.rev=Math.max(S.rev||0,d.rev||0);localStorage.setItem(KEY+'.'+id,d.state);closeModal();render()}catch(e){console.error(e)}}
    else if((d.rev||0)<(S.rev||0)){scheduleCloud()}
    setSync('saved');
  },e=>{console.error(e);syncErr=e;setSync('error');
    if(!warnedOnce){warnedOnce=true;toast('אין גישה לענן. עובדים מהמכשיר.',{label:'בדיקה',fn:diagnostics})}});
  render();
}
function closeTournament(silent){if(unsubT){unsubT();unsubT=null}if(cloudT){clearTimeout(cloudT);pushCloud()}TID=null;S=fresh();if(!silent)render()}
let syncState='idle',syncErr=null,retryN=0,retryT=null,warnedOnce=false;
function scheduleCloud(){setSync('pending');clearTimeout(cloudT);cloudT=setTimeout(()=>pushCloud(),400)}
async function pushCloud(force){
  if(!TID||!USER)return false;cloudT=null;clearTimeout(retryT);
  if(!navigator.onLine){setSync('offline');scheduleRetry();return false}
  setSync('saving');
  const body={name:S.settings.name||'',date:S.settings.date||'',system:S.settings.system,phase:S.phase,playersCount:S.players.length,rev:S.rev||0,client:CLIENT,state:JSON.stringify(S),updatedAt:Date.now(),updatedBy:USER.uid,updatedByName:(PROFILE&&PROFILE.name)||USER.email||''};
  if(force)body.createdBy=USER.uid;
  try{
    await FB.setDoc(FB.doc(FB.db,'tournaments',TID),body,{merge:true});
    retryN=0;syncErr=null;setSync('saved');return true;
  }catch(e){
    console.error('pushCloud',e);syncErr=e;setSync('error');
    if(!warnedOnce){warnedOnce=true;toast('לא נשמר בענן. הנתונים בטוחים במכשיר.',{label:'בדיקה',fn:diagnostics})}
    scheduleRetry();return false;
  }
}
function scheduleRetry(){
  clearTimeout(retryT);retryN=Math.min(retryN+1,6);
  retryT=setTimeout(()=>pushCloud(),Math.min(30000,1000*Math.pow(2,retryN)));
}
const SYNC_UI={idle:['#9AA6A0','—'],pending:['var(--ball)','שומר'],saving:['var(--ball)','שומר'],saved:['#3FBF77','נשמר'],offline:['#9AA6A0','לא מקוון'],error:['#FF6B5A','לא נשמר']};
function setSync(st){
  syncState=st;const d=document.getElementById('syncDot'),t=document.getElementById('syncTxt'),b=document.getElementById('syncBtn');
  if(!d)return;const [c,l]=SYNC_UI[st]||SYNC_UI.idle;
  d.style.background=c;if(t)t.textContent=l;
  if(b)b.classList.toggle('bad',st==='error');
}
window.addEventListener('online',()=>{if(TID)pushCloud()});
window.addEventListener('offline',()=>setSync('offline'));
window.addEventListener('beforeunload',e=>{if(syncState==='error'||syncState==='pending'||syncState==='saving'||syncState==='offline'){e.preventDefault();e.returnValue=''}});

const RULE_TEXT=`match /tournaments/{id} {\n  allow read, write: if hasProfile();\n}`;
async function diagnostics(){
  modal('<h2>בדיקת שמירה בענן</h2><p class="muted">בודק…</p>');
  const rows=[];
  const add=(ok,label,detail)=>rows.push({ok,label,detail:detail||''});
  add(!!USER,'מחובר למשתמש',USER?USER.email:'לא מחובר');
  add(!!PROFILE,'המשתמש מוגדר במועדון',PROFILE?(PROFILE.name||'')+' · '+(PROFILE.role||''):'לא נמצא ב-users');
  add(navigator.onLine,'חיבור לאינטרנט',navigator.onLine?'':'המכשיר לא מקוון');
  let readOk=false,writeOk=false,readErr='',writeErr='';
  try{await FB.getDocs(FB.query(FB.collection(FB.db,'tournaments'),FB.orderBy('date','desc')));readOk=true}
  catch(e){readErr=e.code||e.message}
  add(readOk,'קריאת רשימת התחרויות',readErr);
  try{await FB.setDoc(FB.doc(FB.db,'tournaments','zz-connection-test'),{ping:Date.now(),by:USER?USER.uid:''},{merge:true});writeOk=true}
  catch(e){writeErr=e.code||e.message}
  add(writeOk,'כתיבה לענן',writeErr);
  let localKB=0;try{localKB=Math.round((localStorage.getItem(KEY+'.'+TID)||'').length/1024)}catch(e){}
  const allOk=readOk&&writeOk;
  const fix=(!readOk||!writeOk)?`<div class="warn-box" style="margin-top:14px"><b>מה לעשות</b><br>
    חסרה הרשאה ל-Firestore. בקונסולת Firebase של הפרויקט <b>ttcmh-2a752</b>: Firestore Database ⟵ לשונית Rules, ולהוסיף בתוך הבלוק <code>match /databases/{database}/documents { … }</code> הקיים את השורות הבאות, ואז Publish.<br>
    הכללים מנוהלים כקובץ <code>firestore.rules</code> במאגר של אפליקציית הנוכחות — כדאי להוסיף אותן גם שם, אחרת העדכון הבא ימחק אותן.
    <pre style="background:#fff;border:1px solid var(--edge);border-radius:8px;padding:10px;overflow:auto;font-size:12px;direction:ltr;text-align:left">${esc(RULE_TEXT.replace(/\\n/g,'\n'))}</pre>
    <button onclick="navigator.clipboard.writeText(${JSON.stringify(RULE_TEXT).replace(/"/g,'&quot;')}.replace(/\\n/g,String.fromCharCode(10)));toast('הועתק')">העתקת הכלל</button></div>`:'';
  modal(`<h2>בדיקת שמירה בענן</h2>
  <ul class="plist" style="margin-top:12px">${rows.map(r=>`<li><span style="font-size:18px">${r.ok?'✅':'❌'}</span><span class="n">${r.label}</span><span class="club">${esc(r.detail)}</span></li>`).join('')}</ul>
  <div class="explain" style="margin-top:12px">${allOk?'הכול תקין. כל שינוי נשמר בענן תוך פחות משנייה.':'התחרות ממשיכה לעבוד ונשמרת במכשיר הזה'+(localKB?` (${localKB}KB)`:'')+'. ברגע שההרשאה תתוקן, הכול יעלה לענן אוטומטית.'}</div>
  ${fix}
  <div class="row" style="margin-top:16px"><button class="primary" onclick="closeModal();pushCloud().then(ok=>toast(ok?'נשמר בענן':'עדיין לא נשמר'))">נסה לשמור עכשיו</button>
  <button onclick="exportJSON()">הורדת גיבוי</button><button class="ghost" onclick="closeModal()">סגור</button></div>`);
}

let pubTimer=null;
let pubScreen=0;
const PUB_SCREENS=['now','next','table','results'];
function openPublic(){
  pubScreen=0;pubDraw();
  pubTimer=setInterval(()=>{pubScreen=(pubScreen+1)%PUB_SCREENS.length;pubDraw()},14000);

function pubDraw(){
  const el=document.getElementById('public');if(!el)return;
  const now=Date.now();const busy=busyPids();
  const q=pendingMatches().filter(m=>!matchPids(m).some(id=>busy.has(id))).map(m=>({m,...priority(m,now)}));
  q.forEach(x=>delete x.m._rest);q.sort((a,b)=>b.sc-a.sc);
  const done=canFinish();
  let screens=done?['podium','table','results']:PUB_SCREENS;
  const sc=screens[pubScreen%screens.length];
  const head=`<h1><span>${esc(S.settings.name)||'תן לי שולחן'}</span><span style="font-size:18px;opacity:.6">${screens.map((x,i)=>i===pubScreen%screens.length?'●':'○').join(' ')}</span><button class="ghost" style="color:#fff;font-size:16px" onclick="closePublic()">✕ סגור</button></h1>`;
  let body='';
  if(sc==='now'){
    body=`<div class="tables">${S.tables.map(t=>{const m=t.matchId?S.matches.find(x=>x.id===t.matchId):null;
      return m?`<div class="table"><div class="tnum"><span>שולחן ${t.n}</span><span>${matchLabel(m)}</span></div><div class="players">${esc(sideName(m,1))}<span class="vs">נגד</span>${esc(sideName(m,2))}</div><div class="meta"></div></div>`
      :`<div class="table free"><div class="tnum"><span>שולחן ${t.n}</span></div><div class="free-lbl">פנוי</div><div class="meta"></div></div>`}).join('')}</div>`;
  } else if(sc==='next'){
    body=`<div class="next"><h2>להתכונן — הבאים בתור</h2><ul style="padding:0;margin:0">${q.slice(0,8).map(x=>`<li><span>${esc(sideName(x.m,1))} נגד ${esc(sideName(x.m,2))}</span><small>${matchLabel(x.m)}</small></li>`).join('')||'<li>אין משחקים ממתינים</li>'}</ul></div>`;
  } else if(sc==='results'){
    const dn=S.matches.filter(m=>m.status==='done'&&!m.bye).slice(-8).reverse();
    body=`<div class="next"><h2>תוצאות אחרונות</h2><ul style="padding:0;margin:0">${dn.map(m=>`<li><span>${esc(sideName(m,m.winSide||(m.winner===sideIds(m,1)[0]?1:2)))} ניצח/ה</span><small>${m.score?m.score.join(':'):setsWon(m).join(':')} · ${esc(sideName(m,(m.winSide||(m.winner===sideIds(m,1)[0]?1:2))===1?2:1))}</small></li>`).join('')||'<li>עדיין אין תוצאות</li>'}</ul></div>`;
  } else if(sc==='table'){
    const sy=sys();let rows=[];
    if(sy==='groups-ko'&&!S.koBuilt){rows=S.groups.map(g=>{const r=rankGroup(g.id);return `<div style="margin-bottom:14px"><h2 style="font-size:22px">${g.name}</h2>${r.order.map((id,i)=>`<div style="font-size:22px;padding:4px 0;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12)"><span>${i+1}. ${esc(pname(id))}</span><span>${r.stats[id].mp}</span></div>`).join('')}</div>`});
      body=`<div style="columns:${Math.min(3,S.groups.length)};column-gap:30px">${rows.join('')}</div>`;
    } else {
      const st=sy==='swiss'?swissStandings().map(x=>[pname(x.id),x.mp+' נק׳']):isTeamSys()?amStandings().map(x=>[pname(x.id),x.pts+' נק׳']):sy==='king'?S.players.map(p=>[p.name,((S.kingCrowns||{})[p.id]||0)+' נצ׳']).sort((a,b)=>parseInt(b[1])-parseInt(a[1])):finalRanking().map(x=>[x.p.name,x.extra||'']);
      body=`<div class="next"><h2>טבלה</h2><ul style="padding:0;margin:0">${st.slice(0,12).map((x,i)=>`<li><span>${i+1}. ${esc(x[0])}</span><small>${esc(x[1])}</small></li>`).join('')}</ul></div>`;
    }
  } else if(sc==='podium'){
    const r=finalRanking();
    body=`<div class="podium" style="min-height:300px"><div class="pod p2"><div class="name" style="color:#fff">${esc(r[1]?r[1].p.name:'')}</div><div class="block">2</div></div><div class="pod p1"><div class="name" style="color:#fff">${esc(r[0]?r[0].p.name:'')}</div><div class="block">1</div></div><div class="pod p3"><div class="name" style="color:#fff">${esc(r[2]?r[2].p.name:'')}</div><div class="block">3</div></div></div>`;
  }
  el.innerHTML=`<div class="public">${head}${body}</div>`;
}
